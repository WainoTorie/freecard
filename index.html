<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>一起变好 · 自由卡记录</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f2f2f7; --card: rgba(255, 255, 255, 0.88);
      --text-1: #1d1d1f; --text-2: #86868b; --text-3: #aeaeb2;
      --border: rgba(0, 0, 0, 0.06);
      --torie: #007aff; --jory: #ff9500; --green: #34c759; --red: #ff3b30;
      --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --blur-val: 20px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: rgba(28, 28, 30, 0.88);
        --text-1: #f5f5f7; --text-2: #a1a1a6; --text-3: #636366;
        --border: rgba(255, 255, 255, 0.08); --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    body { background: var(--bg); color: var(--text-1); font-family: var(--font); padding: 20px 16px 120px; min-height: 100vh; line-height: 1.5; transition: background 0.3s, color 0.3s; }
    button, input, select { font-family: inherit; }
    .container { width: min(680px, 100%); margin: 0 auto; position: relative; min-width: 0; }

    .festival-banner { background: linear-gradient(135deg, rgba(255, 149, 0, 0.15), rgba(0, 122, 255, 0.15)); border: 1px solid rgba(255, 149, 0, 0.2); border-radius: var(--r-lg); padding: 20px 24px; margin-bottom: 16px; text-align: center; animation: fadeIn 0.6s ease, festivalPulse 3s ease-in-out infinite; position: relative; overflow: hidden; }
    .festival-banner::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%); pointer-events: none; }
    .festival-emoji { font-size: 36px; display: block; margin-bottom: 8px; animation: tier1Bounce 0.8s ease; }
    .festival-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; background: linear-gradient(135deg, var(--jory), var(--torie)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .festival-sub { font-size: 14px; color: var(--text-2); line-height: 1.5; }
    @keyframes festivalPulse { 0%, 100% { box-shadow: 0 0 8px rgba(255, 149, 0, 0.1); } 50% { box-shadow: 0 0 20px rgba(255, 149, 0, 0.2), 0 0 40px rgba(0, 122, 255, 0.1); } }

    .settings-btn { position: absolute; top: 8px; right: 0; width: 40px; height: 40px; border: none; background: var(--card); backdrop-filter: blur(var(--blur-val)); -webkit-backdrop-filter: blur(var(--blur-val)); border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); border: 1px solid var(--border); z-index: 10; transition: all 0.2s; }
    .settings-btn:active { transform: scale(0.9); }
    .settings-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .settings-overlay.show { opacity: 1; pointer-events: auto; }
    .settings-panel { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: min(400px, calc(100% - 32px)); background: var(--card); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 28px 24px 40px; z-index: 9999; transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); border: 1px solid var(--border); box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.12); }
    .settings-panel.show { transform: translateX(-50%) translateY(0); }
    .settings-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; text-align: center; }
    .setting-row { margin-bottom: 22px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-label { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .setting-label span:last-child { font-size: 12px; opacity: 0.7; }
    .setting-hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: var(--border); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--torie); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3); }

    .page-title { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 6px; background: linear-gradient(135deg, var(--text-1), var(--text-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--text-2); font-size: 15px; margin-bottom: 28px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card); backdrop-filter: blur(var(--blur-val)); -webkit-backdrop-filter: blur(var(--blur-val)); border-radius: var(--r-lg); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: background 0.3s, border-color 0.3s; min-width: 0; }

    .weekly-card { background: linear-gradient(135deg, rgba(0, 122, 255, 0.12), rgba(255, 149, 0, 0.12)); border: 1px solid rgba(0, 122, 255, 0.15); position: relative; overflow: hidden; }
    .weekly-card::before { content: ""; position: absolute; top: -50%; right: -30%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(0, 122, 255, 0.08) 0%, transparent 70%); pointer-events: none; }
    .weekly-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-width: 0; }
    .weekly-icon { font-size: 24px; flex-shrink: 0; }
    .weekly-title { font-size: 15px; font-weight: 700; color: var(--text-1); min-width: 0; }
    .weekly-date { font-size: 12px; color: var(--text-3); margin-left: auto; flex-shrink: 0; }
    .weekly-text { font-size: 15px; line-height: 1.7; color: var(--text-1); font-weight: 500; }
    .weekly-text .highlight { font-weight: 800; }
    .weekly-text .torie-hl { color: var(--torie); }
    .weekly-text .jory-hl { color: var(--jory); }
    .weekly-text .green-hl { color: var(--green); }

    .trend-card { background: linear-gradient(135deg, rgba(52, 199, 89, 0.10), rgba(0, 122, 255, 0.10)); border: 1px solid rgba(52, 199, 89, 0.15); position: relative; overflow: hidden; }
    .trend-card::before { content: ""; position: absolute; top: -50%; left: -30%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(52, 199, 89, 0.08) 0%, transparent 70%); pointer-events: none; }

    .balances { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .balance-box { text-align: center; padding: 20px 12px; border-radius: var(--r-md); transition: transform 0.2s; }
    .balance-box.torie { background: rgba(0, 122, 255, 0.08); color: var(--torie); }
    .balance-box.jory { background: rgba(255, 149, 0, 0.08); color: var(--jory); }
    .balance-name { font-size: 14px; font-weight: 600; opacity: 0.8; margin-bottom: 4px; }
    .balance-number { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
    .balance-unit { font-size: 13px; font-weight: 500; opacity: 0.7; margin-left: 2px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 600; color: var(--text-2); margin-left: 2px; }
    select, input:not([type="range"]) { width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--card); color: var(--text-1); font-size: 16px; outline: none; transition: all 0.2s; appearance: none; min-width: 0; }
    select:focus, input:not([type="range"]):focus { border-color: var(--torie); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); }
    .submit-btn { width: 100%; height: 50px; margin-top: 18px; border: none; border-radius: var(--r-md); background: var(--text-1); color: var(--bg); font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .period-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: rgba(128, 128, 128, 0.08); border-radius: var(--r-md); margin-bottom: 24px; }
    .period-tab { height: 38px; border: none; border-radius: 10px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .period-tab.active { background: var(--card); color: var(--text-1); font-weight: 700; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
    .summary-item { text-align: center; padding: 14px 8px; border-radius: var(--r-md); background: rgba(128, 128, 128, 0.06); }
    .summary-label { font-size: 12px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
    .summary-value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .summary-value.plus { color: var(--green); }
    .summary-value.minus { color: var(--red); }
    .summary-value.net { color: var(--torie); }
    .stats-group { margin-bottom: 24px; }
    .stats-group:last-child { margin-bottom: 0; }
    .stats-label { margin-bottom: 12px; font-size: 15px; font-weight: 700; color: var(--text-2); }
    .bar-row { display: grid; grid-template-columns: 50px minmax(0, 1fr) 36px; align-items: center; gap: 10px; margin: 10px 0; min-width: 0; }
    .bar-name { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .bar-track { height: 20px; background: rgba(128, 128, 128, 0.08); border-radius: 10px; overflow: hidden; min-width: 0; }
    .bar { height: 100%; border-radius: 10px; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); min-width: 0; }
    .bar.torie-bar { background: linear-gradient(90deg, var(--torie), #5ac8fa); }
    .bar.jory-bar { background: linear-gradient(90deg, var(--jory), #ffd60a); }
    .bar-number { text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .empty-stats { padding: 20px 0; color: var(--text-3); font-size: 14px; text-align: center; }

    .history-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; min-width: 0; }
    .history-header .section-title { margin: 0; min-width: 0; }
    .history-filter { width: auto; min-width: 120px; height: 40px; font-size: 14px; border-radius: var(--r-sm); flex-shrink: 0; }
    .history-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 16px 0; border-bottom: 1px solid var(--border); animation: fadeIn 0.3s ease; min-width: 0; width: 100%; align-items: start; }
    .history-item:last-child { border-bottom: none; }
    .history-item > div:first-child { min-width: 0; width: 100%; }
    .history-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; width: 100%; }
    .history-person { font-weight: 700; font-size: 15px; flex-shrink: 0; white-space: nowrap; }
    .history-reason { color: var(--text-2); font-size: 14px; white-space: normal; word-break: break-word; line-height: 1.4; min-width: 0; flex: 1; display: block; }
    .history-time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
    .history-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; min-width: 42px; width: auto; }
    .history-change { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .history-change.plus { color: var(--green); }
    .history-change.minus { color: var(--red); }
    .delete-btn { border: none; background: rgba(255, 59, 48, 0.1); color: var(--red); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; margin-top: 4px; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
    .delete-btn:hover { background: var(--red); color: #fff; }
    .empty-history { padding: 40px 0; text-align: center; color: var(--text-3); font-size: 14px; }

    .bank-segment { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: rgba(128, 128, 128, 0.08); border-radius: var(--r-md); margin-bottom: 20px; }
    .bank-segment-btn { height: 40px; border: none; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all 0.2s; }
    .bank-segment-btn.active { background: var(--card); color: var(--text-1); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }

    .shop-view-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: rgba(128, 128, 128, 0.08); border-radius: var(--r-md); margin-bottom: 20px; }
    .shop-view-btn { height: 40px; border: none; border-radius: 10px; background: transparent; font-size: 15px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all 0.2s; }
    .shop-view-btn.active.torie { background: var(--card); color: var(--torie); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    .shop-view-btn.active.jory { background: var(--card); color: var(--jory); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }

    @keyframes glowPulseGreen { 0%, 100% { box-shadow: 0 0 8px rgba(52, 199, 89, 0.2), 0 0 20px rgba(52, 199, 89, 0.1); } 50% { box-shadow: 0 0 16px rgba(52, 199, 89, 0.4), 0 0 40px rgba(52, 199, 89, 0.2); } }
    @keyframes glowPulseBlue { 0%, 100% { box-shadow: 0 0 6px rgba(0, 122, 255, 0.15), 0 0 16px rgba(0, 122, 255, 0.08); } 50% { box-shadow: 0 0 12px rgba(0, 122, 255, 0.3), 0 0 30px rgba(0, 122, 255, 0.15); } }
    @keyframes glowPulseOrange { 0%, 100% { box-shadow: 0 0 5px rgba(255, 149, 0, 0.12), 0 0 12px rgba(255, 149, 0, 0.06); } 50% { box-shadow: 0 0 10px rgba(255, 149, 0, 0.25), 0 0 24px rgba(255, 149, 0, 0.12); } }
    @keyframes glowBarShimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

    .shop-item { padding: 18px 16px; border-radius: var(--r-md); margin-bottom: 12px; border: 1px solid var(--border); animation: fadeIn 0.3s ease; transition: all 0.4s ease; background: transparent; }
    .shop-item:last-child { margin-bottom: 0; }
    .shop-item.halfway-there { border-color: rgba(255, 149, 0, 0.2); animation: glowPulseOrange 3.5s ease-in-out infinite; }
    .shop-item.almost-there { border-color: rgba(0, 122, 255, 0.25); animation: glowPulseBlue 2.5s ease-in-out infinite; }
    .shop-item.ready-to-redeem { border-color: rgba(52, 199, 89, 0.3); animation: glowPulseGreen 2s ease-in-out infinite; }
    .shop-item.punish-item { border-color: rgba(255, 59, 48, 0.15); }
    .shop-item.punish-item:hover { border-color: rgba(255, 59, 48, 0.3); }

    .shop-item-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .shop-item-name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .shop-item-cost { font-size: 14px; font-weight: 700; color: var(--text-2); white-space: nowrap; flex-shrink: 0; }
    .shop-item-cost.punish { color: var(--red); }
    .shop-item-cost.earn { color: var(--green); }
    
    .shop-progress-text { font-size: 13px; color: var(--text-2); margin-bottom: 6px; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
    .shop-bar-track { height: 14px; background: rgba(128, 128, 128, 0.08); border-radius: 7px; overflow: hidden; }
    .shop-bar { height: 100%; border-radius: 7px; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
    .shop-bar.torie { background: linear-gradient(90deg, var(--torie), #5ac8fa); }
    .shop-bar.jory { background: linear-gradient(90deg, var(--jory), #ffd60a); }
    .shop-bar.full { background: linear-gradient(90deg, var(--green), #30d158) !important; }
    .shop-bar.shimmer { background-size: 200% 100%; animation: glowBarShimmer 2s linear infinite; }
    .shop-bar.shimmer.torie { background-image: linear-gradient(90deg, var(--torie), #5ac8fa, #fff, #5ac8fa, var(--torie)); background-size: 200% 100%; }
    .shop-bar.shimmer.jory { background-image: linear-gradient(90deg, var(--jory), #ffd60a, #fff, #ffd60a, var(--jory)); background-size: 200% 100%; }
    .shop-bar.shimmer.full { background-image: linear-gradient(90deg, var(--green), #30d158, #fff, #30d158, var(--green)) !important; background-size: 200% 100%; }
    .shop-bar.shimmer-slow { background-size: 200% 100%; animation: glowBarShimmer 3.5s linear infinite; }
    .shop-bar.shimmer-slow.torie { background-image: linear-gradient(90deg, var(--torie), #5ac8fa, rgba(255,255,255,0.6), #5ac8fa, var(--torie)); }
    .shop-bar.shimmer-slow.jory { background-image: linear-gradient(90deg, var(--jory), #ffd60a, rgba(255,255,255,0.6), #ffd60a, var(--jory)); }

    .shop-actions { display: flex; gap: 8px; margin-top: 10px; }
    .shop-action-btn { flex: 1; height: 36px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; min-width: 0; }
    .shop-action-btn:active { transform: scale(0.96); }
    .btn-redeem { background: var(--green); color: #fff; }
    .btn-redeem:disabled { background: rgba(128,128,128,0.12); color: var(--text-3); cursor: not-allowed; }
    .btn-earn { background: var(--torie); color: #fff; }
    .btn-punish { background: var(--red); color: #fff; }
    .btn-edit { background: rgba(128,128,128,0.08); color: var(--text-2); }
    .btn-del { background: rgba(255,59,48,0.1); color: var(--red); }

    .add-product-form { display: grid; grid-template-columns: 1fr 100px auto; gap: 10px; align-items: end; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
    .add-product-form .form-group { gap: 4px; }
    .add-btn { height: 48px; border: none; border-radius: var(--r-sm); background: var(--text-1); color: var(--bg); font-size: 14px; font-weight: 700; cursor: pointer; padding: 0 18px; white-space: nowrap; }
    .add-btn:active { transform: scale(0.96); }
    .empty-shop { padding: 40px 0; text-align: center; color: var(--text-3); font-size: 14px; }

    .calorie-card { background: linear-gradient(135deg, rgba(52, 199, 89, 0.08), rgba(0, 122, 255, 0.08)); border: 1px solid rgba(52, 199, 89, 0.15); }
    .calorie-result { text-align: center; padding: 12px; background: rgba(255,255,255,0.5); border-radius: var(--r-sm); margin: 12px 0; font-weight: 700; color: var(--green); font-size: 16px; }

    .app-page { display: none; animation: pageSlideIn 0.25s ease; }
    .app-page.active { display: block; }
    .bank-sub-page { display: none; animation: fadeIn 0.2s ease; }
    .bank-sub-page.active { display: block; }

    @keyframes pageSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tier1Bounce { 0%{transform:scale(0)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

    .bottom-nav { position: fixed; z-index: 1000; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(400px, calc(100% - 32px)); padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); backdrop-filter: blur(var(--blur-val)); -webkit-backdrop-filter: blur(var(--blur-val)); transition: background 0.3s, border-color 0.3s; }
    .nav-btn { height: 56px; border: 0; border-radius: 18px; background: transparent; color: var(--text-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; transition: all 0.2s; }
    .nav-btn:active { transform: scale(0.92); }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-btn.active { background: var(--text-1); color: var(--bg); }

    .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; }
    .toast { padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 600; color: #fff; opacity: 0; transform: translateY(-10px); transition: all 0.3s; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }

    #celebrationCanvas { position: fixed; inset: 0; z-index: 10000; pointer-events: none; width: 100%; height: 100%; }
    .redeem-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .redeem-overlay.show { opacity: 1; pointer-events: auto; }
    .redeem-celebration { text-align: center; color: #fff; transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.22,1,0.36,1); padding: 20px; }
    .redeem-overlay.show .redeem-celebration { transform: scale(1); }

      if (!isSunday || hour < 18) return null;

      const weekStart = getStartOfWeekDate();
      const weekLogs = allLogs.filter((l) => new Date(l.created_at) >= weekStart);
      if (weekLogs.length === 0) return null;

      let tE=0, tS=0, jE=0, jS=0;
      weekLogs.forEach((l) => {
        const n = Number(l.card_num)||0;
        if(l.operator==="Torie"){ if(l.change_type==="增加") tE+=n; else tS+=n; }
        else { if(l.change_type==="增加") jE+=n; else jS+=n; }
      });

      const parts = [];
      parts.push(pick(GREETINGS_SUNDAY));

      // 获得情况
      if(tE>0 && jE>0) parts.push(`这周 <span class="highlight torie-hl">Torie</span> 获得了 ${tE} 张，<span class="highlight jory-hl">Jory</span> 获得了 ${jE} 张`);
      else if(tE>0) parts.push(`这周 <span class="highlight torie-hl">Torie</span> 获得了 ${tE} 张`);
      else if(jE>0) parts.push(`这周 <span class="highlight jory-hl">Jory</span> 获得了 ${jE} 张`);

      // 花费情况
      if(tS+jS>0) parts.push(`一起花掉了 <span class="highlight">${tS+jS}</span> 张自由卡 🎁`);

      // 净积累
      const net = (tE+jE) - (tS+jS);
      if(net>0) parts.push(`净攒 <span class="highlight green-hl">${net}</span> 张 ✨`);
      else if(net===0 && (tE+jE)>0) parts.push("收支完美平衡 ⚖️");

      // Torie 个人分析
      if(tE >= 10) parts.push(pick(TORIE_ADVICE_HIGH_EARN));
      else if(tE > 0 && tE < 5) parts.push(pick(TORIE_ADVICE_LOW_EARN));
      else if(tE === 0 && (tS > 0 || jE > 0)) parts.push(pick(TORIE_ADVICE_LOW_EARN));
      if(tS > tE && tS > 0) parts.push(pick(TORIE_ADVICE_HIGH_SPEND));
      else if(tE >= 5 && tE < 10) parts.push(pick(TORIE_ADVICE_NORMAL));

      // Jory 个人分析
      if(jE >= 10) parts.push(pick(JORY_ADVICE_HIGH_EARN));
      else if(jE > 0 && jE < 5) parts.push(pick(JORY_ADVICE_LOW_EARN));
      else if(jE === 0 && (jS > 0 || tE > 0)) parts.push(pick(JORY_ADVICE_LOW_EARN));
      if(jS > jE && jS > 0) parts.push(pick(JORY_ADVICE_HIGH_SPEND));
      else if(jE >= 5 && jE < 10) parts.push(pick(JORY_ADVICE_NORMAL));

      // 两人总分析
      if(tE > 0 && jE > 0) parts.push(pick(COUPLE_ADVICE_BOTH_ACTIVE));
      else if(tE > 0 || jE > 0) parts.push(pick(COUPLE_ADVICE_ONE_ACTIVE));
      if(net > 0) parts.push(pick(COUPLE_ADVICE_NET_POSITIVE));
      else if(net === 0 && (tE+jE) > 0) parts.push(pick(COUPLE_ADVICE_NET_ZERO));
      else if(net < 0) parts.push(pick(COUPLE_ADVICE_NET_NEGATIVE));

      parts.push(pick(ENCOURAGEMENTS));

      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
      const fmt = (d) => `${d.getMonth()+1}/${d.getDate()}`;
      return { greeting: parts[0], body: parts.slice(1), dateRange: `${fmt(weekStart)} - ${fmt(weekEnd)}` };
    }

    // ========== 近三天趋势（始终显示，只要有数据）==========
    function generateRecentTrend() {
      const now = new Date();
      const threeDaysAgo = new Date(now);
      threeDaysAgo.setDate(threeDaysAgo.getDate() - 2);
      threeDaysAgo.setHours(0,0,0,0);

      const recentLogs = allLogs.filter((l) => new Date(l.created_at) >= threeDaysAgo);
      if (recentLogs.length === 0) return null;

      let tE=0, tS=0, jE=0, jS=0;
      recentLogs.forEach((l) => {
        const n = Number(l.card_num)||0;
        if(l.operator==="Torie"){ if(l.change_type==="增加") tE+=n; else tS+=n; }
        else { if(l.change_type==="增加") jE+=n; else jS+=n; }
      });

      const parts = [];
      const fmt = (d) => `${d.getMonth()+1}/${d.getDate()}`;
      const todayStr = fmt(now);
      const startStr = fmt(threeDaysAgo);
      const dateRange = startStr === todayStr ? todayStr : `${startStr} - ${todayStr}`;

      parts.push(`📊 近三天动态（${dateRange}）`);

      // 数据概览
      if(tE>0 && jE>0) parts.push(`<span class="highlight torie-hl">Torie</span> +${tE}，<span class="highlight jory-hl">Jory</span> +${jE}`);
      else if(tE>0) parts.push(`<span class="highlight torie-hl">Torie</span> 获得了 ${tE} 张`);
      else if(jE>0) parts.push(`<span class="highlight jory-hl">Jory</span> 获得了 ${jE} 张`);
      if(tS+jS>0) parts.push(`花掉了 ${tS+jS} 张`);

      const net = (tE+jE) - (tS+jS);
      if(net>0) parts.push(`净增 <span class="highlight green-hl">${net}</span> 张`);
      else if(net<0) parts.push(`净减 ${Math.abs(net)} 张`);

      // Torie 近三天分析
      if(tE >= 6) parts.push(pick(TORIE_ADVICE_HIGH_EARN));
      else if(tE > 0 && tE < 3) parts.push(pick(TORIE_ADVICE_LOW_EARN));
      else if(tE === 0 && recentLogs.some(l=>l.operator==="Jory")) parts.push("🦊 Torie 这几天还在蓄力，期待你的爆发 🔋");
      if(tS > tE && tS > 0) parts.push(pick(TORIE_ADVICE_HIGH_SPEND));
      else if(tE >= 3 && tE < 6) parts.push(pick(TORIE_ADVICE_NORMAL));

      // Jory 近三天分析
      if(jE >= 6) parts.push(pick(JORY_ADVICE_HIGH_EARN));
      else if(jE > 0 && jE < 3) parts.push(pick(JORY_ADVICE_LOW_EARN));
      else if(jE === 0 && recentLogs.some(l=>l.operator==="Torie")) parts.push("🐰 Jory 这几天在积蓄能量，下次一定更精彩 🌟");
      if(jS > jE && jS > 0) parts.push(pick(JORY_ADVICE_HIGH_SPEND));
      else if(jE >= 3 && jE < 6) parts.push(pick(JORY_ADVICE_NORMAL));

      // 两人总分析
      if(tE > 0 && jE > 0) parts.push(pick(COUPLE_ADVICE_BOTH_ACTIVE));
      else if(tE > 0 || jE > 0) parts.push(pick(COUPLE_ADVICE_ONE_ACTIVE));
      if(net > 3) parts.push(pick(COUPLE_ADVICE_NET_POSITIVE));
      else if(net === 0 && (tE+jE) > 0) parts.push(pick(COUPLE_ADVICE_NET_ZERO));
      else if(net < 0) parts.push(pick(COUPLE_ADVICE_NET_NEGATIVE));

      parts.push(pick(ENCOURAGEMENTS));

      return { greeting: parts[0], body: parts.slice(1), dateRange };
    }

    const canvas = document.getElementById("celebrationCanvas"), ctx = canvas.getContext("2d");
    let particles = [], animFrameId = null;
    function resizeCanvas() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    window.addEventListener("resize", resizeCanvas); resizeCanvas();

    class Particle {
      constructor(x,y,color,size,vx,vy,gravity,life,shape) { this.x=x; this.y=y; this.color=color; this.size=size; this.vx=vx; this.vy=vy; this.gravity=gravity; this.life=life; this.maxLife=life; this.shape=shape; this.rotation=Math.random()*Math.PI*2; this.rotSpeed=(Math.random()-0.5)*0.2; }
      update() { this.x+=this.vx; this.y+=this.vy; this.vy+=this.gravity; this.vx*=0.99; this.life--; this.rotation+=this.rotSpeed; }
      draw(ctx) { const alpha=Math.max(0,this.life/this.maxLife); ctx.save(); ctx.globalAlpha=alpha; ctx.translate(this.x,this.y); ctx.rotate(this.rotation); if(this.shape==="circle"){ ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); } else if(this.shape==="rect"){ ctx.fillStyle=this.color; ctx.fillRect(-this.size,-this.size*0.4,this.size*2,this.size*0.8); } else if(this.shape==="star"){ ctx.beginPath(); for(let i=0;i<5;i++){const a=(i*4*Math.PI)/5-Math.PI/2; ctx[i===0?"moveTo":"lineTo"](Math.cos(a)*this.size,Math.sin(a)*this.size);} ctx.closePath(); ctx.fillStyle=this.color; ctx.fill(); } ctx.restore(); }
    }
    const C1=["#34c759","#30d158","#5ac8fa","#a2d729"], C2=["#007aff","#5ac8fa","#ffd60a","#ff9500","#34c759","#af52de"], C3=["#ff375f","#ff9f0a","#ffd60a","#30d158","#0a84ff","#bf5af2","#ff6482"], C4=["#ffd60a","#ff9f0a","#ff375f","#bf5af2","#0a84ff","#30d158","#5ac8fa","#ff6482","#ac8e68"];

    function spawnParticles(tier) {
      const cx=canvas.width/2, cy=canvas.height/2;
      if(tier===1){ for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3; particles.push(new Particle(cx,cy,C1[Math.floor(Math.random()*C1.length)],2+Math.random()*3,Math.cos(a)*s,Math.sin(a)*s-1,0.02,50+Math.random()*30,"circle"));}}
      else if(tier===2){ for(let i=0;i<60;i++){particles.push(new Particle(Math.random()*canvas.width,-20-Math.random()*100,C2[Math.floor(Math.random()*C2.length)],3+Math.random()*4,(Math.random()-0.5)*4,2+Math.random()*3,0.05,80+Math.random()*40,Math.random()>0.5?"rect":"circle"));}}
      else if(tier===3){ [{x:cx,y:cy*0.6},{x:cx*0.5,y:cy*0.8},{x:cx*1.5,y:cy*0.7}].forEach((bp)=>{for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6; particles.push(new Particle(bp.x,bp.y,C3[Math.floor(Math.random()*C3.length)],2+Math.random()*4,Math.cos(a)*s,Math.sin(a)*s,0.06,60+Math.random()*40,Math.random()>0.3?"circle":"star"));}}); for(let i=0;i<40;i++){particles.push(new Particle(Math.random()*canvas.width,-20,C3[Math.floor(Math.random()*C3.length)],3+Math.random()*5,(Math.random()-0.5)*3,1+Math.random()*4,0.04,100+Math.random()*50,"rect"));}}
      else if(tier===4){ for(let b=0;b<5;b++){const bx=canvas.width*(0.2+Math.random()*0.6),by=canvas.height*(0.2+Math.random()*0.4); setTimeout(()=>{for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*8; particles.push(new Particle(bx,by,C4[Math.floor(Math.random()*C4.length)],3+Math.random()*5,Math.cos(a)*s,Math.sin(a)*s,0.05,70+Math.random()*50,["circle","star","rect"][Math.floor(Math.random()*3)]));}},b*300);} for(let i=0;i<80;i++){setTimeout(()=>{particles.push(new Particle(Math.random()*canvas.width,-20-Math.random()*60,C4[Math.floor(Math.random()*C4.length)],3+Math.random()*6,(Math.random()-0.5)*5,2+Math.random()*4,0.03,120+Math.random()*60,Math.random()>0.4?"rect":"star"));},Math.random()*1000);}}
      if(!animFrameId) animateParticles();
    }
    function animateParticles() { ctx.clearRect(0,0,canvas.width,canvas.height); particles=particles.filter((p)=>p.life>0); particles.forEach((p)=>{p.update();p.draw(ctx);}); if(particles.length>0) animFrameId=requestAnimationFrame(animateParticles); else { animFrameId=null; ctx.clearRect(0,0,canvas.width,canvas.height); } }

    function getStartOfMonth() { const d=new Date(); d.setHours(0,0,0,0); d.setDate(1); return d; }
    function filterByPeriod(logs,period) { if(period==="all") return logs; const map={today:getStartOfToday,week:getStartOfWeekDate,month:getStartOfMonth}; return logs.filter((l)=>new Date(l.created_at)>=map[period]()); }

    function renderStats() {
      const t=filterByPeriod(allLogs,currentPeriod).filter(l=>l.operator==="Torie").reduce((a,l)=>{const n=Number(l.card_num)||0; l.change_type==="增加"?a.e+=n:a.s+=n; return a;},{e:0,s:0});
      const j=filterByPeriod(allLogs,currentPeriod).filter(l=>l.operator==="Jory").reduce((a,l)=>{const n=Number(l.card_num)||0; l.change_type==="增加"?a.e+=n:a.s+=n; return a;},{e:0,s:0});
      const totalE=t.e+j.e, totalS=t.s+j.s, net=totalE-totalS, pLabel={today:"今日",week:"本周",month:"本月",all:"累计"}[currentPeriod];
      document.getElementById("statsSummary").innerHTML=`<div class="summary-item"><div class="summary-label">${pLabel}获得</div><div class="summary-value plus">+${totalE}</div></div><div class="summary-item"><div class="summary-label">${pLabel}使用</div><div class="summary-value minus">−${totalS}</div></div><div class="summary-item"><div class="summary-label">${pLabel}净积累</div><div class="summary-value ${net>=0?"net":"minus"}">${net>=0?"+":""}${net}</div></div>`;
      const max=Math.max(t.e,t.s,j.e,j.s), group=(label,ek,sk)=>{ if(max===0) return `<div class="stats-group"><div class="stats-label">${label}</div><div class="empty-stats">暂无记录</div></div>`; return `<div class="stats-group"><div class="stats-label">${label}</div>${bar("Torie",t[ek],max,"torie-bar")}${bar("Jory",j[ek],max,"jory-bar")}</div>`; };

    function updateHistoryFilterOptions() {
      const select=document.getElementById("historyFilter"), months=new Set();
      allLogs.forEach((l)=>{const d=new Date(l.created_at);months.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);});
      const sorted=[...months].sort((a,b)=>b.localeCompare(a)), current=currentHistoryFilter;
      select.innerHTML='<option value="all">全部</option>';
      sorted.forEach((key)=>{const[y,m]=key.split("-");const o=document.createElement("option");o.value=key;o.textContent=`${y}年${Number(m)}月`;select.appendChild(o);});
      if([...select.options].some((o)=>o.value===current))select.value=current; else{currentHistoryFilter="all";select.value="all";}
    }

    function renderHistory() {
      const container=document.getElementById("historyList");
      const logs=currentHistoryFilter==="all"?allLogs:allLogs.filter((l)=>{const d=new Date(l.created_at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`===currentHistoryFilter;});
      if(!logs.length){container.innerHTML='<div class="empty-history">暂无记录 🍃</div>';return;}
      container.innerHTML=logs.map((l)=>{
        const d=new Date(l.created_at),time=fmtDate(d),plus=l.change_type==="增加",symbol=plus?"+":"−";
        return `<div class="history-item"><div><div class="history-top"><span class="history-person">${esc(l.operator)}</span><span class="history-reason">${esc(l.reason||"—")}</span></div><div class="history-time">${time}</div></div><div class="history-right"><div class="history-change ${plus?"plus":"minus"}">${symbol}${Number(l.card_num)}</div><button class="delete-btn" data-del-log="${escAttr(l.id)}">删除</button></div></div>`;
      }).join("");
      container.querySelectorAll("[data-del-log]").forEach(b=>b.addEventListener("click",()=>deleteLog(b.dataset.delLog)));
    }

    function classifyProduct(p) {
      if (p.name.startsWith(TYPE_PREFIX.earn)) return "earn";
      if (p.name.startsWith(TYPE_PREFIX.punish)) return "punish";
      return "shop";
    }

    function getDisplayName(p) {
      return p.name.replace(TYPE_PREFIX.earn, "").replace(TYPE_PREFIX.punish, "");
    }

    function renderList(containerId, type, view) {
      const container = document.getElementById(containerId);
      const items = allProducts.filter(p => p.owner === view && classifyProduct(p) === type);
      
      if(!items.length) { 
        container.innerHTML = `<div class="empty-shop">还没有${type==='shop'?'心愿':type==='earn'?'任务':'惩罚'}，快来添加吧</div>`; 
        return; 
      }
      const balance = calcBalance(view);
      container.innerHTML = items.map(p => {
        const isPunish = type === "punish", isEarn = type === "earn";
        const displayName = getDisplayName(p);
        const pct = Math.min(100, Math.round((balance / p.cost) * 100)), canRedeem = balance >= p.cost;
        let itemClass = "shop-item", barExtraClass = "", progressText = "", actionBtn = "";
        if (isPunish) { itemClass += " punish-item"; actionBtn = `<button class="shop-action-btn btn-punish" data-action="punish" data-id="${escAttr(p.id)}">⚠️ 触发扣除</button>`; } 
        else if (isEarn) { actionBtn = `<button class="shop-action-btn btn-earn" data-action="earn" data-id="${escAttr(p.id)}">✅ 完成领取</button>`; } 
        else {
          if(canRedeem){itemClass+=" ready-to-redeem";barExtraClass=" full shimmer";progressText=`<span>✅ 已达成！</span><span>${balance} / ${p.cost} 张</span>`;}
          else if(pct>=80){itemClass+=" almost-there";barExtraClass=" shimmer";progressText=`<span>🔥 就差一点了！</span><span>${balance} / ${p.cost} 张</span>`;}
          else if(pct>=50){itemClass+=" halfway-there";barExtraClass=" shimmer-slow";progressText=`<span>💪 已经过半啦</span><span>${balance} / ${p.cost} 张</span>`;}
          else{progressText=`<span>${balance} / ${p.cost} 张</span><span>还差 ${p.cost-balance} 张</span>`;}
          actionBtn = `<button class="shop-action-btn btn-redeem" ${canRedeem?"":"disabled"} data-action="redeem" data-id="${escAttr(p.id)}">${canRedeem?"🎁 立即兑换":"余额不足"}</button>`;
        }
        const barClass = `shop-bar ${view.toLowerCase()}${barExtraClass}`, costClass = isPunish ? "punish" : isEarn ? "earn" : "", costPrefix = isPunish ? "扣除 " : isEarn ? "奖励 " : "";
        return `<div class="${itemClass}"><div class="shop-item-header"><div class="shop-item-name">${esc(displayName)}</div><div class="shop-item-cost ${costClass}">${costPrefix}${p.cost} 张</div></div>${!isPunish && !isEarn ? `<div class="shop-progress-text">${progressText}</div><div class="shop-bar-track"><div class="${barClass}" style="width:${pct}%"></div></div>` : ''}<div class="shop-actions">${actionBtn}<button class="shop-action-btn btn-edit" data-action="edit" data-id="${escAttr(p.id)}">编辑</button><button class="shop-action-btn btn-del" data-action="del" data-id="${escAttr(p.id)}">下架</button></div></div>`;
      }).join("");
      container.querySelectorAll("[data-action]").forEach(b => b.addEventListener("click", () => handleListAction(b.dataset.action, b.dataset.id, type, view)));
    }

    function renderShop() { renderList("shopList", "shop", shopView); }
    function renderEarnList() { renderList("earnList", "earn", earnView); }
    function renderPunishList() { renderList("punishList", "punish", punishView); }

    async function handleListAction(action, id, type, view) {
      const p = allProducts.find(x => String(x.id) === String(id)); if(!p) return;
      const displayName = getDisplayName(p);
      if(action === "del") { if(!confirm("确定下架此项目？")) return; const {error} = await sb.from("freecard_shop").delete().eq("id", id); if(error) return showToast("下架失败", "error"); showToast("已下架", "success"); await loadProducts(); } 
      else if(action === "edit") { 
        const newName = prompt("修改名称：", displayName); if(newName===null) return; 
        const newCost = prompt("修改数值（张）：", p.cost); if(newCost===null) return; 
        const cost = parseInt(newCost); if(!newName.trim() || !cost || cost<1) return showToast("输入无效", "error"); 
        const prefix = type === "earn" ? TYPE_PREFIX.earn : type === "punish" ? TYPE_PREFIX.punish : "";
        const {error} = await sb.from("freecard_shop").update({name: prefix + newName.trim(), cost}).eq("id", id); 
        if(error) return showToast("修改失败", "error"); showToast("已更新", "success"); await loadProducts(); 
      }
      else if(action === "redeem") { if(calcBalance(view) < p.cost) return showToast("余额不足", "error"); if(!confirm(`确认花费 ${p.cost} 张兑换「${displayName}」？`)) return; const {error} = await sb.from("freecard_log").insert({operator:view, change_type:"减少", card_num:p.cost, reason:`🛒 兑换：${displayName}`}); if(error) return showToast("兑换失败", "error"); showRedeemCeremony(p, p.cost); await loadLogs(); }
      else if(action === "earn") { const {error} = await sb.from("freecard_log").insert({operator:view, change_type:"增加", card_num:p.cost, reason:`💪 任务：${displayName}`}); if(error) return showToast("领取失败", "error"); showToast(`成功领取 ${p.cost} 张！`, "success"); spawnParticles(1); await loadLogs(); }
      else if(action === "punish") { if(calcBalance(view) < p.cost) { if(!confirm(`${view} 余额不足，是否允许透支扣除？`)) return; } else { if(!confirm(`确认扣除 ${p.cost} 张自由卡（${displayName}）？`)) return; } const {error} = await sb.from("freecard_log").insert({operator:view, change_type:"减少", card_num:p.cost, reason:`⚠️ 惩罚：${displayName}`}); if(error) return showToast("扣除失败", "error"); showToast(`已扣除 ${p.cost} 张，下次注意哦`, "error"); if(navigator.vibrate) navigator.vibrate(200); await loadLogs(); }
    }

    function setupAdd(type, nameId, costId, btnId, viewGetter) {
      document.getElementById(btnId).addEventListener("click", async () => {
        const rawName = document.getElementById(nameId).value.trim();
        const cost = parseInt(document.getElementById(costId).value);
        if(!rawName) return showToast("请输入名称", "error"); 
        if(!cost || cost<1) return showToast("数值至少为 1", "error");
        
        const btn = document.getElementById(btnId); btn.disabled = true; btn.textContent = "...";
        
        const prefix = type === "earn" ? TYPE_PREFIX.earn : type === "punish" ? TYPE_PREFIX.punish : "";
        const finalName = prefix + rawName;
        const finalOwner = viewGetter();
        
        const {error} = await sb.from("freecard_shop").insert({name: finalName, cost, owner: finalOwner});
        btn.disabled = false; btn.textContent = "添加";
        if(error) { showToast("添加失败：" + error.message, "error"); return; }
        
        document.getElementById(nameId).value = ""; document.getElementById(costId).value = ""; 
        showToast("添加成功 🎉", "success"); await loadProducts();
      });
    }

    function setupAddProduct() { setupAdd("shop", "newProductName", "newProductCost", "addProductBtn", () => shopView); }
    function setupAddEarn() { setupAdd("earn", "newEarnName", "newEarnCost", "addEarnBtn", () => earnView); }
    function setupAddPunish() { setupAdd("punish", "newPunishName", "newPunishCost", "addPunishBtn", () => punishView); }

    async function deleteLog(id) { if(!confirm("确定删除这条记录？")) return; const {error} = await sb.from("freecard_log").delete().eq("id", id); if(error) return showToast("删除失败", "error"); showToast("已删除", "success"); await loadLogs(); }
    function fmtDate(d) { const p=(n)=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
    function esc(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function escAttr(v) { return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#039;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function showToast(msg,type="success") { const toast=document.getElementById("toast"); toast.textContent=msg; toast.className=`toast ${type} show`; clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>{toast.classList.remove("show");},2500); }
  </script>
</body>
</html>
