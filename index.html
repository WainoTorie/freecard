<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>一起变好 · 自由卡记录</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f2f2f7;
      --card: rgba(255,255,255,0.88);
      --text-1: #1d1d1f;
      --text-2: #86868b;
      --text-3: #aeaeb2;
      --border: rgba(0,0,0,0.06);
      --torie: #007aff;
      --jory: #ff9500;
      --green: #34c759;
      --red: #ff3b30;
      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --font: -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      --blur-val: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: rgba(28,28,30,0.88);
        --text-1: #f5f5f7;
        --text-2: #a1a1a6;
        --text-3: #636366;
        --border: rgba(255,255,255,0.08);
        --shadow: 0 4px 24px rgba(0,0,0,0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-1); font-family: var(--font); padding: 20px 16px 120px; min-height: 100vh; line-height: 1.5; transition: background .3s, color .3s; }
    .container { width: min(680px,100%); margin: 0 auto; position: relative; }

    .settings-btn { position: absolute; top: 8px; right: 0; width: 40px; height: 40px; border: none; background: var(--card); backdrop-filter: blur(var(--blur-val)); -webkit-backdrop-filter: blur(var(--blur-val)); border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); border: 1px solid var(--border); z-index: 10; transition: all .2s; }
    .settings-btn:active { transform: scale(0.9); }

    .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9998; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .settings-overlay.show { opacity: 1; pointer-events: auto; }
    .settings-panel { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: min(400px, calc(100% - 32px)); background: var(--card); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 28px 24px 40px; z-index: 9999; transition: transform .3s cubic-bezier(.22,1,.36,1); border: 1px solid var(--border); box-shadow: 0 -8px 32px rgba(0,0,0,0.12); }
    .settings-panel.show { transform: translateX(-50%) translateY(0); }
    .settings-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; text-align: center; }
    .setting-row { margin-bottom: 22px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-label { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .setting-label span:last-child { font-size: 12px; opacity: .7; }
    .setting-hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }

    input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: var(--border); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--torie); cursor: pointer; box-shadow: 0 2px 8px rgba(0,122,255,0.3); }
