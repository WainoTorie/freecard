<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>自由卡双人记录</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
    body{background:#f4f7fa;padding:20px;color:#222}
    .container{max-width:1000px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px #00000010}
    h1{text-align:center;margin-bottom:24px;color:#2563eb}
    /* 余额看板 */
    .balance-board{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
    .balance-card{background:#eff6ff;padding:16px;border-radius:12px;text-align:center}
    .balance-card h3{color:#2563eb;margin-bottom:8px}
    .balance-num{font-size:32px;font-weight:bold}
    /* 录入面板 */
    .form-area{background:#f8fafc;padding:20px;border-radius:12px;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .full{grid-column:1/-1}
    label{display:block;margin-bottom:6px;font-weight:500}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
    button{background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer}
    button:hover{background:#1d4ed8}
    /* 选项卡 */
    .tabs{display:flex;gap:8px;margin-bottom:16px}
    .tab{padding:8px 16px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
    .tab.active{background:#2563eb;color:white;border-color:#2563eb}
    .chart-wrap{height:280px;margin-bottom:20px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #e2e8f0;padding:10px;text-align:left}
    th{background:#eff6ff}
    .del{background:#ef4444}
    .msg{margin:12px 0;padding:10px;border-radius:8px;display:none}
    .ok{background:#dcfce7;color:#166534}
    .err{background:#fee2e2;color:#991b1b}
  </style>
</head>
<body>
<div class="container">
  <h1>自由卡双人记录</h1>
  <div id="msg" class="msg"></div>

  <!-- 余额看板 -->
  <div class="balance-board">
    <div class="balance-card">
      <h3>Torie</h3>
      <div class="balance-num" id="bal-torie">0</div>
      <div>张</div>
    </div>
    <div class="balance-card">
      <h3>Jory</h3>
      <div class="balance-num" id="bal-jory">0</div>
      <div>张</div>
    </div>
  </div>

  <!-- 录入面板 -->
  <div class="form-area">
    <div class="form-row">
      <div>
        <label>操作人</label>
        <select id="operator">
          <option value="Torie">Torie</option>
          <option value="Jory">Jory</option>
        </select>
      </div>
      <div>
        <label>变动类型</label>
        <select id="changeType">
          <option value="add">增加✅</option>
          <option value="sub">减少❌</option>
        </select>
      </div>
      <div>
        <label>卡片数量（1~10）</label>
        <select id="cardCount">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>
      <div class="full">
        <label>事件原因</label>
        <textarea id="reason" placeholder="填写本次变动原因"></textarea>
      </div>
    </div>
    <button onclick="submitRecord()">提交记录</button>
  </div>

  <!-- 统计选项卡 -->
  <div class="tabs">
    <div class="tab active" data-type="today">今日</div>
    <div class="tab" data-type="week">周统计</div>
    <div class="tab" data-type="month">月统计</div>
    <div class="tab" data-type="all">总统计</div>
  </div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <!-- 历史流水 -->
  <table>
    <thead>
      <tr>
        <th>时间</th>
        <th>操作人</th>
        <th>±</th>
        <th>卡数</th>
        <th>原因</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script>
// ========= Supabase配置 =========
const SUPABASE_URL = "https://vimaqasjmrocpqyepudw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yV3tVy_arOvm5HTNhwoVNw_lEyE70ah";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = "today";
let allData = [];
let chartIns = null;

// 消息提示
function showMsg(text,isOk=true){
  const el=document.getElementById('msg');
  el.textContent=text;
  el.style.display='block';
  el.className='msg '+(isOk?'ok':'err');
  setTimeout(()=>el.style.display='none',3000)
}

// 计算余额
function calcBalance(records){
  let torie=0,jory=0;
  records.forEach(r=>{
    const num = Number(r.count);
    if(r.operator === 'Torie'){
      r.change_type==='add' ? torie+=num : torie-=num;
    }else{
      r.change_type==='add' ? jory+=num : jory-=num;
    }
  })
  return {torie,jory};
}

// 筛选时间
function filterByTime(list,type){
  const now=new Date();
  const start=new Date();
  if(type==='today'){
    start.setHours(0,0,0,0);
  }else if(type==='week'){
    start.setDate(now.getDate()-7);
  }else if(type==='month'){
    start.setMonth(now.getMonth()-1);
  }else if(type==='all'){
    return list;
  }
  return list.filter(x=>new Date(x.created_at)>=start);
}

// 渲染图表
function renderChart(data){
  const ctx = document.getElementById('chart').getContext('2d');
  if(chartIns) chartIns.destroy();
  const add = data.filter(x=>x.change_type==='add').reduce((s,i)=>s+Number(i.count),0);
  const sub = data.filter(x=>x.change_type==='sub').reduce((s,i)=>s+Number(i.count),0);
  chartIns = new Chart(ctx,{
    type:'bar',
    data:{labels:['增加✅','减少❌'],datasets:[{data:[add,sub],backgroundColor:['#22c55e','#ef4444']}]},
    options:{responsive:true,maintainAspectRatio:false}
  })
}

// 渲染流水表格
function renderTable(list){
  const tb=document.getElementById('list');
  tb.innerHTML='';
  list.forEach(item=>{
    const dt = new Date(item.created_at).toLocaleString();
    const sign = item.change_type==='add' ? '+' : '-';
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${dt}</td>
      <td>${item.operator}</td>
      <td>${sign}</td>
      <td>${item.count}</td>
      <td>${item.reason||''}</td>
      <td><button class="del" onclick="delItem('${item.id}')">删除</button></td>
    `;
    tb.appendChild(tr);
  })
}

// 加载全部数据
async function loadAll(){
  const {data,error}=await supabase.from('freecard_log').select('*').order('created_at',{ascending:false});
  if(error) return showMsg(error.message,false);
  allData=data;
  // 更新余额看板
  const bal = calcBalance(allData);
  document.getElementById('bal-torie').innerText=bal.torie;
  document.getElementById('bal-jory').innerText=bal.jory;
  refreshTab();
}

// 切换选项卡刷新
function refreshTab(){
  const filtered = filterByTime(allData,currentTab);
  renderChart(filtered);
  renderTable(filtered);
}

// 提交新增记录
async function submitRecord(){
  const operator = document.getElementById('operator').value;
  const changeType = document.getElementById('changeType').value;
  const count = Number(document.getElementById('cardCount').value);
  const reason = document.getElementById('reason').value.trim();
  if(!reason){
    return showMsg('请填写事件原因',false);
  }
  const {error}=await supabase.from('freecard_log').insert([{
    operator, change_type:changeType, count, reason
  }]);
  if(error) return showMsg(error.message,false);
  showMsg('提交成功！');
  document.getElementById('reason').value='';
  loadAll();
}

// 删除条目
async function delItem(id){
  if(!confirm('确认删除这条记录？删除后余额会自动重算！'))return;
  const {error}=await supabase.from('freecard_log').delete().eq('id',id);
  if(error) return showMsg(error.message,false);
  showMsg('已删除');
  loadAll();
}

// 绑定选项卡点击
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.type;
    refreshTab();
  }
})

// 页面初始化
loadAll();
</script>
</body>
</html>
