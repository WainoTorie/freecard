<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一起变好 · 自由卡记录</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      padding-bottom: 110px;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .container {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 8px 0 28px;
      text-align: center;
      color: #86868b;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    /* =========================
       余额
    ========================= */

    .balances {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .balance-box {
      text-align: center;
      padding: 18px 10px;
      border-radius: 16px;
      background: #f5f5f7;
    }

    .balance-name {
      font-size: 15px;
      color: #6e6e73;
      margin-bottom: 6px;
    }

    .balance-number {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .balance-unit {
      font-size: 14px;
      color: #86868b;
      margin-left: 3px;
    }

    /* =========================
       标题
    ========================= */

    .section-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    /* =========================
       表单
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      color: #6e6e73;
    }

    select,
    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      background: #fff;
      color: #1d1d1f;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #86868b;
    }

    .submit-btn {
      width: 100%;
      height: 46px;
      margin-top: 16px;
      border: none;
      border-radius: 11px;
      background: #1d1d1f;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      min-height: 20px;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #6e6e73;
    }

    /* =========================
       统计周期
    ========================= */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px;
      background: #f5f5f7;
      border-radius: 11px;
      margin-bottom: 24px;
    }

    .period-tab {
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #6e6e73;
      font-size: 14px;
      cursor: pointer;
    }

    .period-tab.active {
      background: white;
      color: #1d1d1f;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* =========================
       统计图
       四条柱子共用同一个尺度
    ========================= */

    .stats-group {
      margin-bottom: 28px;
    }

    .stats-group:last-child {
      margin-bottom: 0;
    }

    .stats-label {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 38px;
      align-items: center;
      gap: 10px;
      margin: 11px 0;
    }

    .bar-name {
      font-size: 14px;
      color: #6e6e73;
    }

    .bar-track {
      height: 18px;
      background: #f0f0f2;
      border-radius: 6px;
      overflow: hidden;
      min-width: 0;
    }

    .bar {
      height: 100%;
      min-width: 0;
      border-radius: 6px;
      background: #1d1d1f;
      transition: width 0.35s ease;
    }

    .bar.jory {
      background: #8e8e93;
    }

    .bar-number {
      text-align: right;
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .empty-stats {
      padding: 12px 0;
      color: #86868b;
      font-size: 14px;
      text-align: center;
    }

    /* =========================
       历史流水
    ========================= */

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .history-header .section-title {
      margin: 0;
    }

    .history-filter {
      width: auto;
      min-width: 130px;
      height: 38px;
      font-size: 14px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
    }

    /*
      这里是本次修改的关键。

      原来：
      125px 65px 48px 48px 1fr auto

      修改为：
      125px 65px 48px 48px minmax(0, 1fr) auto

      minmax(0, 1fr) 允许“原因”这一列真正缩小，
      不会因为文字太长把右边的删除按钮挤出去。
    */
    .history-item {
      display: grid;
      grid-template-columns:
        125px
        65px
        48px
        48px
        minmax(0, 1fr)
        auto;
      align-items: start;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #eeeef0;
      font-size: 14px;

      /*
        防止整个 grid item 因为内部长文本
        出现横向溢出。
      */
      min-width: 0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      color: #86868b;
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .history-person {
      font-weight: 600;
      min-width: 0;
    }

    .history-change {
      font-size: 18px;
      font-weight: 700;
      min-width: 0;
    }

    /* 增加：绿色 */
    .history-change.plus {
      color: #34a853;
    }

    /* 减少：红色 */
    .history-change.minus {
      color: #e53935;
    }

    .history-number {
      font-weight: 600;
      min-width: 0;
    }

    /*
      原因文本：

      1. min-width: 0
         允许 grid 中这一列真正缩小。

      2. white-space: normal
         明确允许正常换行。

      3. overflow-wrap: anywhere
         如果出现特别长的连续字符，也可以强制断开。

      4. word-break: break-word
         兼容普通中英文文本的换行。
    */
    .history-reason {
      min-width: 0;
      color: #424245;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.5;
    }

    /*
      删除按钮固定在自己的 auto 列，
      不会被原因文本挤走。
    */
    .delete-btn {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: #86868b;
      font-size: 13px;
      cursor: pointer;
      padding: 5px 0;
      white-space: nowrap;
      min-width: 28px;
    }

    .delete-btn:hover {
      color: #1d1d1f;
    }

    .empty-history {
      padding: 30px 0 12px;
      text-align: center;
      color: #86868b;
      font-size: 14px;
    }

    /* =========================
       App 页面 / 底部导航
    ========================= */

    .app-page {
      display: none;
      animation: pageIn 0.18s ease;
    }

    .app-page.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bottom-nav-wrap {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(520px, calc(100% - 28px));
      padding: 6px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.12),
        0 2px 8px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .nav-tab {
      height: 54px;
      border: none;
      border-radius: 17px;
      background: transparent;
      color: #86868b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 500;
      transition:
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .nav-tab-icon {
      font-size: 19px;
      line-height: 1;
    }

    .nav-tab.active {
      background: #1d1d1f;
      color: white;
      font-weight: 600;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.14);
    }

    .nav-tab:active {
      transform: scale(0.97);
    }

    /* =========================
       手机
    ========================= */

    @media (max-width: 680px) {

      body {
        padding: 14px;
        padding-bottom: 104px;
      }

      .card {
        padding: 17px;
        border-radius: 17px;
      }

      h1 {
        font-size: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .history-header {
        align-items: flex-start;
      }

      .history-filter {
        min-width: 120px;
      }

      /*
        手机端重新布局：

        第一行：
        时间                         删除

        第二行：
        人物    +    数量

        第三行：
        原因（完整宽度，自然换行）
      */
      .history-item {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 5px 10px;
        padding: 15px 0;
        min-width: 0;
      }

      .history-time {
        grid-column: 1;
        grid-row: 1;
        min-width: 0;
      }

      .history-person {
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
      }

      .history-change {
        grid-column: 2;
        grid-row: 2;
        justify-self: start;
      }

      .history-number {
        grid-column: 2;
        grid-row: 2;
        justify-self: end;
      }

      .history-reason {
        grid-column: 1 / -1;
        grid-row: 3;
        margin-top: 2px;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .delete-btn {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
      }

      .balance-number {
        font-size: 30px;
      }

      .bar-row {
        grid-template-columns: 48px minmax(0, 1fr) 32px;
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>一起变好 · 自由卡记录</h1>

    <div class="subtitle">
      记录每一次获得，也记录每一次自由
    </div>

    <main id="appPages">

      <!-- =====================================================
           记录页面
      ===================================================== -->

      <section id="page-record" class="app-page active">

        <!-- 当前余额 -->

        <div class="card">

          <div class="balances">

            <div class="balance-box">

              <div class="balance-name">
                Torie
              </div>

              <div>

                <span
                  id="torieBalance"
                  class="balance-number"
                >0</span>

                <span class="balance-unit">
                  张
                </span>

              </div>

            </div>


            <div class="balance-box">

              <div class="balance-name">
                Jory
              </div>

              <div>

                <span
                  id="joryBalance"
                  class="balance-number"
                >0</span>

                <span class="balance-unit">
                  张
                </span>

              </div>

            </div>

          </div>

        </div>


        <!-- 新增记录 -->

        <div class="card">

          <h2 class="section-title">
            记录自由卡
          </h2>


          <div class="form-grid">

            <div class="form-group">

              <label for="operator">
                谁
              </label>

              <select id="operator">

                <option value="Torie">
                  Torie
                </option>

                <option value="Jory">
                  Jory
                </option>

              </select>

            </div>


            <div class="form-group">

              <label for="changeType">
                变化
              </label>

              <select id="changeType">

                <option value="增加">
                  增加✅
                </option>

                <option value="减少">
                  减少❌
                </option>

              </select>

            </div>


            <div class="form-group full">

              <label for="reason">
                原因
              </label>

              <input
                id="reason"
                type="text"
                maxlength="100"
                placeholder="例如：完成英语学习、玩游戏"
              />

            </div>


            <div class="form-group">

              <label for="cardNum">
                数量
              </label>

              <select id="cardNum"></select>

            </div>

          </div>


          <button
            id="submitBtn"
            class="submit-btn"
          >
            提交记录
          </button>


          <div id="status"></div>

        </div>

      </section>


      <!-- =====================================================
           统计页面
      ===================================================== -->

      <section id="page-stats" class="app-page">

        <div class="card">

          <h2 class="section-title">
            统计
          </h2>


          <div class="period-tabs">

            <button
              class="period-tab active"
              data-period="today"
            >
              今日
            </button>

            <button
              class="period-tab"
              data-period="week"
            >
              本周
            </button>

            <button
              class="period-tab"
              data-period="month"
            >
              本月
            </button>

            <button
              class="period-tab"
              data-period="all"
            >
              总计
            </button>

          </div>


          <div id="statsContent"></div>

        </div>

      </section>


      <!-- =====================================================
           历史页面
      ===================================================== -->

      <section id="page-history" class="app-page">

        <div class="card">

          <div class="history-header">

            <h2 class="section-title">
              历史流水
            </h2>


            <select
              id="historyFilter"
              class="history-filter"
            >

              <option value="all">
                全部
              </option>

            </select>

          </div>


          <div
            id="historyList"
            class="history-list"
          ></div>

        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       底部导航
  ===================================================== -->

  <div class="bottom-nav-wrap">

    <nav
      class="bottom-nav"
      aria-label="页面导航"
    >

      <button
        class="nav-tab active"
        type="button"
        data-page="record"
      >
        <span class="nav-tab-icon">
          📝
        </span>

        <span>
          记录自由卡
        </span>
      </button>


      <button
        class="nav-tab"
        type="button"
        data-page="stats"
      >
        <span class="nav-tab-icon">
          📊
        </span>

        <span>
          统计
        </span>
      </button>


      <button
        class="nav-tab"
        type="button"
        data-page="history"
      >
        <span class="nav-tab-icon">
          📋
        </span>

        <span>
          历史流水
        </span>
      </button>

    </nav>

  </div>


  <script>

    /* =====================================================
       Supabase
    ===================================================== */

    const SUPABASE_URL =
      "https://vimaqasjmrocpqyepudw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_yV3tVy_arOvm5HTNhwoVNw_lEyE70ah";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       状态
    ===================================================== */

    let allLogs = [];

    let currentPeriod = "today";

    let currentHistoryFilter = "all";


    /* =====================================================
       初始化
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        initCardOptions();

        loadLogs();


        document
          .querySelectorAll(".nav-tab")
          .forEach(tab => {

            tab.addEventListener(
              "click",
              () => {

                const page =
                  tab.dataset.page;


                document
                  .querySelectorAll(".nav-tab")
                  .forEach(btn =>
                    btn.classList.remove(
                      "active"
                    )
                  );


                document
                  .querySelectorAll(".app-page")
                  .forEach(section =>
                    section.classList.remove(
                      "active"
                    )
                  );


                tab.classList.add(
                  "active"
                );


                const target =
                  document.getElementById(
                    `page-${page}`
                  );


                if (target) {

                  target.classList.add(
                    "active"
                  );

                }


                window.scrollTo({
                  top: 0,
                  behavior: "smooth"
                });

              }
            );

          });


        document
          .querySelectorAll(".period-tab")
          .forEach(button => {

            button.addEventListener(
              "click",
              () => {

                document
                  .querySelectorAll(
                    ".period-tab"
                  )
                  .forEach(btn =>
                    btn.classList.remove(
                      "active"
                    )
                  );


                button.classList.add(
                  "active"
                );


                currentPeriod =
                  button.dataset.period;


                renderStats();

              }
            );

          });


        document
          .getElementById("submitBtn")
          .addEventListener(
            "click",
            addLog
          );


        document
          .getElementById(
            "historyFilter"
          )
          .addEventListener(
            "change",
            event => {

              currentHistoryFilter =
                event.target.value;

              renderHistory();

            }
          );


        /* =========================
           实时同步
        ========================= */

        supabaseClient
          .channel(
            "freecard-realtime"
          )
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "freecard_log"
            },
            () => {

              loadLogs();

            }
          )
          .subscribe();

      }
    );


    /* =====================================================
       数量选项
    ===================================================== */

    function initCardOptions() {

      const select =
        document.getElementById(
          "cardNum"
        );


      for (
        let i = 1;
        i <= 10;
        i++
      ) {

        const option =
          document.createElement(
            "option"
          );


        option.value = i;

        option.textContent =
          `${i} 张`;


        select.appendChild(
          option
        );

      }

    }


    /* =====================================================
       读取全部记录
    ===================================================== */

    async function loadLogs() {

      const {
        data,
        error
      } = await supabaseClient
        .from("freecard_log")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        showStatus(
          "读取数据失败：" +
          error.message,
          true
        );

        return;
      }


      allLogs = data || [];

      refreshEverything();

    }


    /* =====================================================
       总刷新
    ===================================================== */

    function refreshEverything() {

      updateBalances();

      updateHistoryFilterOptions();

      renderStats();

      renderHistory();

    }


    /* =====================================================
       余额
    ===================================================== */

    function calculateBalance(
      operator
    ) {

      return allLogs
        .filter(
          log =>
            log.operator === operator
        )
        .reduce(
          (
            total,
            log
          ) => {

            const num =
              Number(
                log.card_num
              ) || 0;


            if (
              log.change_type ===
              "增加"
            ) {

              return total + num;

            }


            if (
              log.change_type ===
              "减少"
            ) {

              return total - num;

            }


            return total;

          },
          0
        );

    }


    function updateBalances() {

      const torie =
        calculateBalance(
          "Torie"
        );

      const jory =
        calculateBalance(
          "Jory"
        );


      document.getElementById(
        "torieBalance"
      ).textContent =
        torie;


      document.getElementById(
        "joryBalance"
      ).textContent =
        jory;

    }


    /* =====================================================
       时间
    ===================================================== */

    function getStartOfToday() {

      const date =
        new Date();


      date.setHours(
        0,
        0,
        0,
        0
      );


      return date;

    }


    function getStartOfWeek() {

      const date =
        getStartOfToday();


      const day =
        date.getDay();


      const diff =
        day === 0
          ? 6
          : day - 1;


      date.setDate(
        date.getDate() - diff
      );


      return date;

    }


    function getStartOfMonth() {

      const date =
        new Date();


      date.setHours(
        0,
        0,
        0,
        0
      );


      date.setDate(1);


      return date;

    }


    function filterLogsByPeriod(
      logs,
      period
    ) {

      if (
        period === "all"
      ) {

        return logs;

      }


      let startDate;


      if (
        period === "today"
      ) {

        startDate =
          getStartOfToday();

      }


      if (
        period === "week"
      ) {

        startDate =
          getStartOfWeek();

      }


      if (
        period === "month"
      ) {

        startDate =
          getStartOfMonth();

      }


      return logs.filter(
        log =>
          new Date(
            log.created_at
          ) >= startDate
      );

    }


    /* =====================================================
       统计
       四条柱状图使用同一个最大尺度
    ===================================================== */

    function getStats(
      operator
    ) {

      const logs =
        filterLogsByPeriod(
          allLogs,
          currentPeriod
        ).filter(
          log =>
            log.operator === operator
        );


      let earned = 0;

      let spent = 0;


      logs.forEach(
        log => {

          const num =
            Number(
              log.card_num
            ) || 0;


          if (
            log.change_type ===
            "增加"
          ) {

            earned += num;

          }


          if (
            log.change_type ===
            "减少"
          ) {

            spent += num;

          }

        }
      );


      return {
        earned,
        spent
      };

    }


    function renderStats() {

      const torie =
        getStats("Torie");

      const jory =
        getStats("Jory");


      const commonMax =
        Math.max(
          torie.earned,
          torie.spent,
          jory.earned,
          jory.spent
        );


      const html = `

        <div class="stats-group">

          <div class="stats-label">
            获得
          </div>

          ${
            commonMax === 0
              ? `
                <div class="empty-stats">
                  这个时间段还没有获得记录
                </div>
              `
              : `

                ${renderBar(
                  "Torie",
                  torie.earned,
                  commonMax,
                  false
                )}

                ${renderBar(
                  "Jory",
                  jory.earned,
                  commonMax,
                  true
                )}

              `
          }

        </div>


        <div class="stats-group">

          <div class="stats-label">
            消耗
          </div>

          ${
            commonMax === 0
              ? `
                <div class="empty-stats">
                  这个时间段还没有消耗记录
                </div>
              `
              : `

                ${renderBar(
                  "Torie",
                  torie.spent,
                  commonMax,
                  false
                )}

                ${renderBar(
                  "Jory",
                  jory.spent,
                  commonMax,
                  true
                )}

              `
          }

        </div>

      `;


      document.getElementById(
        "statsContent"
      ).innerHTML =
        html;

    }


    function renderBar(
      name,
      value,
      max,
      isJory
    ) {

      const width =
        max === 0
          ? 0
          : (
              value / max
            ) * 100;


      return `

        <div class="bar-row">

          <div class="bar-name">
            ${name}
          </div>

          <div class="bar-track">

            <div
              class="
                bar
                ${isJory ? "jory" : ""}
              "
              style="
                width: ${width}%;
              "
            ></div>

          </div>

          <div class="bar-number">
            ${value}
          </div>

        </div>

      `;

    }


    /* =====================================================
       历史年月筛选
    ===================================================== */

    function updateHistoryFilterOptions() {

      const select =
        document.getElementById(
          "historyFilter"
        );


      const months =
        new Set();


      allLogs.forEach(
        log => {

          const date =
            new Date(
              log.created_at
            );


          const year =
            date.getFullYear();


          const month =
            String(
              date.getMonth() + 1
            ).padStart(
              2,
              "0"
            );


          months.add(
            `${year}-${month}`
          );

        }
      );


      const sortedMonths =
        [...months].sort(
          (a, b) =>
            b.localeCompare(a)
        );


      const currentValue =
        currentHistoryFilter;


      select.innerHTML =
        `
          <option value="all">
            全部
          </option>
        `;


      sortedMonths.forEach(
        key => {

          const [
            year,
            month
          ] =
            key.split("-");


          const option =
            document.createElement(
              "option"
            );


          option.value =
            key;


          option.textContent =
            `${year}年${Number(month)}月`;


          select.appendChild(
            option
          );

        }
      );


      if (
        [...select.options].some(
          option =>
            option.value ===
            currentValue
        )
      ) {

        select.value =
          currentValue;

      } else {

        currentHistoryFilter =
          "all";

        select.value =
          "all";

      }

    }


    /* =====================================================
       历史流水
    ===================================================== */

    function getHistoryLogs() {

      if (
        currentHistoryFilter ===
        "all"
      ) {

        return allLogs;

      }


      return allLogs.filter(
        log => {

          const date =
            new Date(
              log.created_at
            );


          const year =
            date.getFullYear();


          const month =
            String(
              date.getMonth() + 1
            ).padStart(
              2,
              "0"
            );


          return (
            `${year}-${month}` ===
            currentHistoryFilter
          );

        }
      );

    }


    function renderHistory() {

      const container =
        document.getElementById(
          "historyList"
        );


      const logs =
        getHistoryLogs();


      if (
        logs.length === 0
      ) {

        container.innerHTML = `

          <div class="empty-history">
            暂无记录
          </div>

        `;

        return;

      }


      container.innerHTML =
        logs
          .map(
            log => {

              const date =
                new Date(
                  log.created_at
                );


              const time =
                formatDateTime(
                  date
                );


              const isPlus =
                log.change_type ===
                "增加";


              const symbol =
                isPlus
                  ? "+"
                  : "−";


              return `

                <div
                  class="history-item"
                >

                  <div
                    class="history-time"
                  >
                    ${time}
                  </div>


                  <div
                    class="history-person"
                  >
                    ${escapeHtml(
                      log.operator
                    )}
                  </div>


                  <div
                    class="
                      history-change
                      ${
                        isPlus
                          ? "plus"
                          : "minus"
                      }
                    "
                  >
                    ${symbol}
                  </div>


                  <div
                    class="history-number"
                  >
                    ${Number(
                      log.card_num
                    )}
                  </div>


                  <div
                    class="history-reason"
                  >
                    ${escapeHtml(
                      log.reason ||
                      "—"
                    )}
                  </div>


                  <button
                    class="delete-btn"
                    onclick="
                      deleteLog(
                        '${log.id}'
                      )
                    "
                  >
                    删除
                  </button>

                </div>

              `;

            }
          )
          .join("");

    }


    /* =====================================================
       新增记录
    ===================================================== */

    async function addLog() {

      const operator =
        document.getElementById(
          "operator"
        ).value;


      const changeType =
        document.getElementById(
          "changeType"
        ).value;


      const reason =
        document.getElementById(
          "reason"
        ).value.trim();


      const cardNum =
        Number(
          document.getElementById(
            "cardNum"
          ).value
        );


      if (!reason) {

        showStatus(
          "请填写原因",
          true
        );

        return;

      }


      if (
        !Number.isInteger(
          cardNum
        ) ||
        cardNum < 1 ||
        cardNum > 10
      ) {

        showStatus(
          "数量必须是 1–10 张",
          true
        );

        return;

      }


      /* =========================
         防止余额减少到负数
      ========================= */

      if (
        changeType ===
        "减少"
      ) {

        const balance =
          calculateBalance(
            operator
          );


        if (
          balance < cardNum
        ) {

          showStatus(
            `${operator} 当前只有 ${balance} 张自由卡，不能减少 ${cardNum} 张`,
            true
          );

          return;

        }

      }


      const button =
        document.getElementById(
          "submitBtn"
        );


      button.disabled = true;

      button.textContent =
        "保存中…";


      const {
        error
      } =
        await supabaseClient
          .from(
            "freecard_log"
          )
          .insert({
            operator,
            change_type:
              changeType,
            card_num:
              cardNum,
            reason
          });


      button.disabled = false;

      button.textContent =
        "提交记录";


      if (error) {

        showStatus(
          "保存失败：" +
          error.message,
          true
        );

        return;

      }


      document.getElementById(
        "reason"
      ).value = "";


      showStatus(
        "记录成功"
      );


      await loadLogs();

    }


    /* =====================================================
       删除记录
    ===================================================== */

    async function deleteLog(
      id
    ) {

      const confirmed =
        confirm(
          "确定要删除这条自由卡记录吗？\n删除后余额和统计会重新计算。"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from(
            "freecard_log"
          )
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        showStatus(
          "删除失败：" +
          error.message,
          true
        );

        return;

      }


      showStatus(
        "记录已删除"
      );


      await loadLogs();

    }


    /* =====================================================
       日期格式
    ===================================================== */

    function formatDateTime(
      date
    ) {

      const year =
        date.getFullYear();


      const month =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        );


      const hours =
        String(
          date.getHours()
        ).padStart(
          2,
          "0"
        );


      const minutes =
        String(
          date.getMinutes()
        ).padStart(
          2,
          "0"
        );


      return `${year}-${month}-${day} ${hours}:${minutes}`;

    }


    /* =====================================================
       HTML 安全处理
    ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =====================================================
       状态提示
    ===================================================== */

    function showStatus(
      message,
      isError = false
    ) {

      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        message;


      status.style.color =
        isError
          ? "#c62828"
          : "#6e6e73";


      clearTimeout(
        showStatus.timer
      );


      showStatus.timer =
        setTimeout(
          () => {

            status.textContent =
              "";

          },
          3000
        );

    }

  </script>
