<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自由卡双人记录</title>
    <!-- 引入Supabase的魔法工具 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f4f7fa; padding: 20px; font-family: system-ui, sans-serif; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px #00000010; }
        h1 { text-align: center; color: #2563eb; }
        .score-row { display: grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:30px; }
        .card-box { background:#eff6ff; text-align:center; padding:20px; border-radius:12px; }
        .name { font-size:22px; font-weight:bold; color:#2563eb; }
        .num { font-size:40px; font-weight:bold; margin:8px 0; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        label { display:block; margin-bottom:6px; font-weight:500; }
        select,textarea { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px; }
        textarea { min-height:80px; }
        button { background:#2563eb; color:white; border:none; padding:12px 24px; border-radius:8px; font-size:16px; cursor:pointer; }
        button:hover { background:#1d4ed8; }
        .log-area { margin-top:30px; }
        .log-item { background:#f8fafc; padding:12px; border-radius:8px; margin-bottom:10px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>自由卡双人记录</h1>
        <div class="score-row">
            <div class="card-box">
                <div class="name">Torie</div>
                <div class="num" id="torieCount">0</div>
                <div>张</div>
            </div>
            <div class="card-box">
                <div class="name">Jory</div>
                <div class="num" id="joryCount">0</div>
                <div>张</div>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>操作人</label>
                <select id="operator">
                    <option>Torie</option>
                    <option>Jory</option>
                </select>
            </div>
            <div>
                <label>变动类型</label>
                <select id="changeType">
                    <option value="add">增加✅</option>
                    <option value="sub">减少❌</option>
                </select>
            </div>
        </div>
        <div style="margin-bottom:16px;">
            <label>卡片数量 (1~10)</label>
            <select id="cardNum">
                <option>1</option><option>2</option><option>3</option><option>4</option>
                <option>5</option><option>6</option><option>7</option><option>8</option>
                <option>9</option><option>10</option>
            </select>
        </div>
        <div style="margin-bottom:20px;">
            <label>事件原因</label>
            <textarea id="reason"></textarea>
        </div>
        <button type="button" onclick="submitRecord()">提交记录</button>

        <div class="log-area">
            <h3>📜 历史记录</h3>
            <div id="logList">正在读取数据，请稍等...</div>
        </div>
    </div>

<script>
// 这里放你的钥匙和地址
const SUPABASE_URL = 'https://vimaqasjmrocpqyepudw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yV3tVy_arOvm5HTNhwoVNw_lEyE70ah';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 打开网页时，先从云端数据库里把数据拿出来
async function loadData(){
    let { data: logs } = await supabase.from('freecard_log').select('*').order('created_at', { ascending: true });
    
    if(!logs) logs = [];
    
    // 重新算一遍分数
    let torie = 0, jory = 0;
    logs.forEach(item => {
        if(item.operator === 'Torie'){
            if(item.change_type === 'add') torie += item.card_num;
            else torie -= item.card_num;
        } else if(item.operator === 'Jory'){
            if(item.change_type === 'add') jory += item.card_num;
            else jory -= item.card_num;
        }
    });

    document.getElementById("torieCount").innerText = torie;
    document.getElementById("joryCount").innerText = jory;
    
    // 渲染历史记录
    const logDom = document.getElementById("logList");
    logDom.innerHTML = "";
    logs.reverse().forEach(item=>{
        const div = document.createElement("div");
        div.className = "log-item";
        const typeText = item.change_type === "add" ? "增加" : "减少";
        const timeStr = new Date(item.created_at).toLocaleString();
        div.innerHTML = `<div><strong>${timeStr}</strong> | ${item.operator} ${typeText} ${item.card_num}张</div><div>原因：${item.reason}</div>`;
        logDom.appendChild(div);
    });
}

// 按下按钮时，把数据写到云端数据库
async function submitRecord(){
    const btn = document.querySelector("button");
    btn.innerText = "正在提交...";
    btn.disabled = true;

    const op = document.getElementById("operator").value;
    const type = document.getElementById("changeType").value;
    const num = parseInt(document.getElementById("cardNum").value);
    const reason = document.getElementById("reason").value.trim();

    if(!reason){
        alert("请填写事件原因");
        btn.innerText = "提交记录";
        btn.disabled = false;
        return;
    }

    const { error } = await supabase.from('freecard_log').insert([
        { operator: op, change_type: type, card_num: num, reason: reason }
    ]);

    if(error){
        alert("提交失败了：" + error.message);
    } else {
        alert("提交成功！数据已经保存到云端啦。");
        document.getElementById("reason").value = "";
        loadData(); // 重新刷新一下数据
    }
    
    btn.innerText = "提交记录";
    btn.disabled = false;
}

// 一打开网页就开始加载数据
loadData();
</script>
</body>
</html>
