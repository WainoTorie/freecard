<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>一起变好 · 自由卡记录</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f2f2f7;
      --card: rgba(255, 255, 255, 0.88);
      --text-1: #1d1d1f;
      --text-2: #86868b;
      --text-3: #aeaeb2;
      --border: rgba(0, 0, 0, 0.06);

      --torie: #007aff;
      --jory: #ff9500;
      --green: #34c759;
      --red: #ff3b30;

      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 10px;

      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);

      --font:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      --blur-val: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: rgba(28, 28, 30, 0.88);
        --text-1: #f5f5f7;
        --text-2: #a1a1a6;
        --text-3: #636366;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font);
      padding: 20px 16px 120px;
      min-height: 100vh;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .container {
      width: min(680px, 100%);
      margin: 0 auto;
      position: relative;
      min-width: 0;
    }

    /* =====================================================
       ★ Festival Banner (新增)
    ===================================================== */
    .festival-banner {
      background: linear-gradient(135deg, rgba(255, 149, 0, 0.15), rgba(0, 122, 255, 0.15));
      border: 1px solid rgba(255, 149, 0, 0.2);
      border-radius: var(--r-lg);
      padding: 20px 24px;
      margin-bottom: 16px;
      text-align: center;
      animation: fadeIn 0.6s ease, festivalPulse 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .festival-banner::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .festival-emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
      animation: tier1Bounce 0.8s ease;
    }

    .festival-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--jory), var(--torie));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .festival-sub {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.5;
    }

    @keyframes festivalPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(255, 149, 0, 0.1); }
      50% { box-shadow: 0 0 20px rgba(255, 149, 0, 0.2), 0 0 40px rgba(0, 122, 255, 0.1); }
    }

    /* =====================================================
       Settings
    ===================================================== */

    .settings-btn {
      position: absolute;
      top: 8px;
      right: 0;
      width: 40px;
      height: 40px;
      border: none;
      background: var(--card);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      z-index: 10;
      transition: all 0.2s;
    }

    .settings-btn:active {
      transform: scale(0.9);
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .settings-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: min(400px, calc(100% - 32px));
      background: var(--card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 28px 24px 40px;
      z-index: 9999;
      transition:
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1px solid var(--border);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.12);
    }

    .settings-panel.show {
      transform: translateX(-50%) translateY(0);
    }

    .settings-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 24px;
      text-align: center;
    }

    .setting-row {
      margin-bottom: 22px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-label span:last-child {
      font-size: 12px;
      opacity: 0.7;
    }

    .setting-hint {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 4px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--torie);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
    }

    /* =====================================================
       Common
    ===================================================== */

    .page-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: linear-gradient(
        135deg,
        var(--text-1),
        var(--text-2)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-2);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border-radius: var(--r-lg);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition:
        background 0.3s,
        border-color 0.3s;
      min-width: 0;
    }

    /* =====================================================
       Weekly
    ===================================================== */

    .weekly-card {
      background:
        linear-gradient(
          135deg,
          rgba(0, 122, 255, 0.12),
          rgba(255, 149, 0, 0.12)
        );
      border: 1px solid rgba(0, 122, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .weekly-card::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(
        circle,
        rgba(0, 122, 255, 0.08) 0%,
        transparent 70%
      );
      pointer-events: none;
    }

    .weekly-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      min-width: 0;
    }

    .weekly-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .weekly-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      min-width: 0;
    }

    .weekly-date {
      font-size: 12px;
      color: var(--text-3);
      margin-left: auto;
      flex-shrink: 0;
    }

    .weekly-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-1);
      font-weight: 500;
    }

    .weekly-text .highlight {
      font-weight: 800;
    }

    .weekly-text .torie-hl {
      color: var(--torie);
    }

    .weekly-text .jory-hl {
      color: var(--jory);
    }

    .weekly-text .green-hl {
      color: var(--green);
    }

    /* =====================================================
       Balance
    ===================================================== */

    .balances {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .balance-box {
      text-align: center;
      padding: 20px 12px;
      border-radius: var(--r-md);
      transition: transform 0.2s;
    }

    .balance-box.torie {
      background: rgba(0, 122, 255, 0.08);
      color: var(--torie);
    }

    .balance-box.jory {
      background: rgba(255, 149, 0, 0.08);
      color: var(--jory);
    }

    .balance-name {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    .balance-number {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .balance-unit {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.7;
      margin-left: 2px;
    }

    /* =====================================================
       Forms
    ===================================================== */

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      margin-left: 2px;
    }

    select,
    input:not([type="range"]) {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--card);
      color: var(--text-1);
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
      appearance: none;
      min-width: 0;
    }

    select:focus,
    input:not([type="range"]):focus {
      border-color: var(--torie);
      box-shadow:
        0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      margin-top: 18px;
      border: none;
      border-radius: var(--r-md);
      background: var(--text-1);
      color: var(--bg);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* =====================================================
       Stats
    ===================================================== */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      background: rgba(128, 128, 128, 0.08);
      border-radius: var(--r-md);
      margin-bottom: 24px;
    }

    .period-tab {
      height: 38px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-tab.active {
      background: var(--card);
      color: var(--text-1);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .summary-item {
      text-align: center;
      padding: 14px 8px;
      border-radius: var(--r-md);
      background: rgba(128, 128, 128, 0.06);
    }

    .summary-label {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .summary-value.plus {
      color: var(--green);
    }

    .summary-value.minus {
      color: var(--red);
    }

    .summary-value.net {
      color: var(--torie);
    }

    .stats-group {
      margin-bottom: 24px;
    }

    .stats-group:last-child {
      margin-bottom: 0;
    }

    .stats-label {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-2);
    }

    .bar-row {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      min-width: 0;
    }

    .bar-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
    }

    .bar-track {
      height: 20px;
      background: rgba(128, 128, 128, 0.08);
      border-radius: 10px;
      overflow: hidden;
      min-width: 0;
    }

    .bar {
      height: 100%;
      border-radius: 10px;
      transition:
        width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 0;
    }

    .bar.torie-bar {
      background:
        linear-gradient(
          90deg,
          var(--torie),
          #5ac8fa
        );
    }

    .bar.jory-bar {
      background:
        linear-gradient(
          90deg,
          var(--jory),
          #ffd60a
        );
    }

    .bar-number {
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .empty-stats {
      padding: 20px 0;
      color: var(--text-3);
      font-size: 14px;
      text-align: center;
    }

    /* =====================================================
       ★ History / 流水明细
    ===================================================== */

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      min-width: 0;
    }

    .history-header .section-title {
      margin: 0;
      min-width: 0;
    }

    .history-filter {
      width: auto;
      min-width: 120px;
      height: 40px;
      font-size: 14px;
      border-radius: var(--r-sm);
      flex-shrink: 0;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
      min-width: 0;
      width: 100%;
      align-items: start;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item > div:first-child {
      min-width: 0;
      width: 100%;
    }

    .history-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      width: 100%;
    }

    .history-person {
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .history-reason {
      color: var(--text-2);
      font-size: 14px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
      min-width: 0;
      flex: 1;
      display: block;
    }

    .history-time {
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      white-space: nowrap;
    }

    .history-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      min-width: 42px;
      width: auto;
    }

    .history-change {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .history-change.plus {
      color: var(--green);
    }

    .history-change.minus {
      color: var(--red);
    }

    .delete-btn {
      border: none;
      background: rgba(255, 59, 48, 0.1);
      color: var(--red);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: var(--red);
      color: #fff;
    }

    .empty-history {
      padding: 40px 0;
      text-align: center;
      color: var(--text-3);
      font-size: 14px;
    }

    /* =====================================================
       Shop
    ===================================================== */

    .shop-view-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: rgba(128, 128, 128, 0.08);
      border-radius: var(--r-md);
      margin-bottom: 20px;
    }

    .shop-view-btn {
      height: 40px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.2s;
    }

    .shop-view-btn.active.torie {
      background: var(--card);
      color: var(--torie);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .shop-view-btn.active.jory {
      background: var(--card);
      color: var(--jory);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* =====================================================
       Shop animations
    ===================================================== */

    @keyframes glowPulseGreen {
      0%, 100% { box-shadow: 0 0 8px rgba(52, 199, 89, 0.2), 0 0 20px rgba(52, 199, 89, 0.1); }
      50% { box-shadow: 0 0 16px rgba(52, 199, 89, 0.4), 0 0 40px rgba(52, 199, 89, 0.2); }
    }

    @keyframes glowPulseBlue {
      0%, 100% { box-shadow: 0 0 6px rgba(0, 122, 255, 0.15), 0 0 16px rgba(0, 122, 255, 0.08); }
      50% { box-shadow: 0 0 12px rgba(0, 122, 255, 0.3), 0 0 30px rgba(0, 122, 255, 0.15); }
    }

    @keyframes glowPulseOrange {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 149, 0, 0.12), 0 0 12px rgba(255, 149, 0, 0.06); }
      50% { box-shadow: 0 0 10px rgba(255, 149, 0, 0.25), 0 0 24px rgba(255, 149, 0, 0.12); }
    }

    @keyframes glowBarShimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .shop-item {
      padding: 18px 16px;
      border-radius: var(--r-md);
      margin-bottom: 12px;
      border: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
      transition: all 0.4s ease;
      background: transparent;
    }

    .shop-item:last-child { margin-bottom: 0; }
    .shop-item.halfway-there { border-color: rgba(255, 149, 0, 0.2); animation: glowPulseOrange 3.5s ease-in-out infinite; }
    .shop-item.almost-there { border-color: rgba(0, 122, 255, 0.25); animation: glowPulseBlue 2.5s ease-in-out infinite; }
    .shop-item.ready-to-redeem { border-color: rgba(52, 199, 89, 0.3); animation: glowPulseGreen 2s ease-in-out infinite; }

    .shop-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .shop-item-name {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .shop-item-cost {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .shop-progress-text {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .shop-bar-track {
      height: 14px;
      background: rgba(128, 128, 128, 0.08);
      border-radius: 7px;
      overflow: hidden;
    }

    .shop-bar {
      height: 100%;
      border-radius: 7px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .shop-bar.torie { background: linear-gradient(90deg, var(--torie), #5ac8fa); }
    .shop-bar.jory { background: linear-gradient(90deg, var(--jory), #ffd60a); }
    .shop-bar.full { background: linear-gradient(90deg, var(--green), #30d158) !important; }

    .shop-bar.shimmer { background-size: 200% 100%; animation: glowBarShimmer 2s linear infinite; }
    .shop-bar.shimmer.torie { background-image: linear-gradient(90deg, var(--torie), #5ac8fa, #fff, #5ac8fa, var(--torie)); background-size: 200% 100%; }
    .shop-bar.shimmer.jory { background-image: linear-gradient(90deg, var(--jory), #ffd60a, #fff, #ffd60a, var(--jory)); background-size: 200% 100%; }
    .shop-bar.shimmer.full { background-image: linear-gradient(90deg, var(--green), #30d158, #fff, #30d158, var(--green)) !important; background-size: 200% 100%; }

    .shop-bar.shimmer-slow { background-size: 200% 100%; animation: glowBarShimmer 3.5s linear infinite; }

  <!-- =====================================================
       JavaScript
  ===================================================== -->
  <script>
    /* =====================================================
       Supabase
    ===================================================== */
    const SUPABASE_URL = "https://vimaqasjmrocpqyepudw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yV3tVy_arOvm5HTNhwoVNw_lEyE70ah";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allLogs = [];
    let allProducts = [];
    let currentPeriod = "today";
    let currentHistoryFilter = "all";
    let shopView = "Torie";

    /* =====================================================
       ★ Special Dates / 节日限定惊喜
    ===================================================== */
    const SPECIAL_DATES = [
      {
        month: 9, day: 2,
        emoji: "🎂",
        title: "Jory 生日快乐！",
        sub: "愿你的每一天都像今天一样闪闪发光 ✨",
        tier: 3
      },
      {
        month: 11, day: 2,
        emoji: "💕",
        title: "纪念日快乐！",
        sub: "从那天起，每一天都是最好的日子",
        tier: 4
      },
      {
        month: 11, day: 23,
        emoji: "🎀",
        title: "Torie 生日快乐！",
        sub: "被爱包围的你，值得世间所有美好 🌸",
        tier: 3
      }
    ];

    function checkSpecialDate() {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();

      const match = SPECIAL_DATES.find(
        (s) => s.month === m && s.day === d
      );

      if (!match) return;

      // 渲染横幅
      const container = document.getElementById("festivalBannerContainer");
      container.innerHTML = `
        <div class="festival-banner">
          <span class="festival-emoji">${match.emoji}</span>
          <div class="festival-title">${match.title}</div>
          <div class="festival-sub">${match.sub}</div>
        </div>
      `;

      // 延迟一点播放庆祝动画，避免和页面加载冲突
      setTimeout(() => {
        spawnParticles(match.tier);
      }, 600);
    }

    /* =====================================================
       Weekly Summary
    ===================================================== */
    function getStartOfWeekDate() {
      const d = new Date();
      d.setHours(0,0,0,0);
      const day = d.getDay();
      d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      return d;
    }

    function generateWeeklySummary() {
      const weekStart = getStartOfWeekDate();
      const weekLogs = allLogs.filter((l) => new Date(l.created_at) >= weekStart);
      if (weekLogs.length === 0) return null;

      let tEarned=0, tSpent=0, jEarned=0, jSpent=0;
      weekLogs.forEach((l) => {
        const n = Number(l.card_num)||0;
        if(l.operator==="Torie"){ if(l.change_type==="增加") tEarned+=n; else tSpent+=n; }
        else { if(l.change_type==="增加") jEarned+=n; else jSpent+=n; }
      });

      const totalEarned = tEarned+jEarned;
      const totalSpent = tSpent+jSpent;
      const parts = [];
      const now = new Date();
      const greeting = now.getDay()===0 ? "🌅 周日快乐！这是你们的一周小结" : "📬 本周进行中的故事";
      parts.push(greeting);

      if(tEarned>0 && jEarned>0) parts.push(`这周 <span class="highlight torie-hl">Torie</span> 获得了 ${tEarned} 张，<span class="highlight jory-hl">Jory</span> 获得了 ${jEarned} 张`);
      else if(tEarned>0) parts.push(`这周 <span class="highlight torie-hl">Torie</span> 获得了 ${tEarned} 张，继续加油 💪`);
      else if(jEarned>0) parts.push(`这周 <span class="highlight jory-hl">Jory</span> 获得了 ${jEarned} 张，势头不错 🔥`);

      if(totalSpent>0) parts.push(`一起兑换了 <span class="highlight">${totalSpent}</span> 张自由卡的心愿 🎁`);

      const net = totalEarned - totalSpent;
      if(net>0) parts.push(`净攒 <span class="highlight green-hl">${net}</span> 张，离梦想又近了一步 ✨`);
      else if(net===0 && totalEarned>0) parts.push("赚的和花的一样多，完美的平衡 ⚖️");

      const closers = ["每一步都算数，一起变好 🌱","你们都在成为更好的自己 💫","平凡日子里的坚持，最了不起 🌟","爱的账户，余额在增长 💕"];
      parts.push(closers[Math.floor(Math.random()*closers.length)]);

      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate()+6);
      const fmt = (d) => `${d.getMonth()+1}/${d.getDate()}`;

      return { greeting: parts[0], body: parts.slice(1), dateRange: `${fmt(weekStart)} - ${fmt(weekEnd)}` };
    }

    function renderWeeklyCard() {
      const card = document.getElementById("weeklyCard");
      const summary = generateWeeklySummary();
      if(!summary){ card.style.display="none"; return; }
      card.style.display="block";
      card.innerHTML = `
        <div class="weekly-header">
          <span class="weekly-icon">💌</span>
          <span class="weekly-title">${summary.greeting}</span>
          <span class="weekly-date">${summary.dateRange}</span>
        </div>
        <div class="weekly-text">${summary.body.join("，")}。</div>
      `;
    }

    /* =====================================================
       Celebration Effects
    ===================================================== */
    const canvas = document.getElementById("celebrationCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animFrameId = null;

    function resizeCanvas() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x,y,color,size,vx,vy,gravity,life,shape) {
        this.x=x; this.y=y; this.color=color; this.size=size;
        this.vx=vx; this.vy=vy; this.gravity=gravity;
        this.life=life; this.maxLife=life; this.shape=shape;
        this.rotation=Math.random()*Math.PI*2;
        this.rotSpeed=(Math.random()-0.5)*0.2;
      }
      update() {
        this.x+=this.vx; this.y+=this.vy;
        this.vy+=this.gravity; this.vx*=0.99;
        this.life--; this.rotation+=this.rotSpeed;
      }
      draw(ctx) {
        const alpha=Math.max(0,this.life/this.maxLife);
        ctx.save(); ctx.globalAlpha=alpha;
        ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
        if(this.shape==="circle"){ ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); }
        else if(this.shape==="rect"){ ctx.fillStyle=this.color; ctx.fillRect(-this.size,-this.size*0.4,this.size*2,this.size*0.8); }
        else if(this.shape==="star"){ ctx.beginPath(); for(let i=0;i<5;i++){const a=(i*4*Math.PI)/5-Math.PI/2; ctx[i===0?"moveTo":"lineTo"](Math.cos(a)*this.size,Math.sin(a)*this.size);} ctx.closePath(); ctx.fillStyle=this.color; ctx.fill(); }
        ctx.restore();
      }
    }

    const C1=["#34c759","#30d158","#5ac8fa","#a2d729"];
    const C2=["#007aff","#5ac8fa","#ffd60a","#ff9500","#34c759","#af52de"];
    const C3=["#ff375f","#ff9f0a","#ffd60a","#30d158","#0a84ff","#bf5af2","#ff6482"];
    const C4=["#ffd60a","#ff9f0a","#ff375f","#bf5af2","#0a84ff","#30d158","#5ac8fa","#ff6482","#ac8e68"];

    function spawnParticles(tier) {
      const cx=canvas.width/2, cy=canvas.height/2;
      if(tier===1){ for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3; particles.push(new Particle(cx,cy,C1[Math.floor(Math.random()*C1.length)],2+Math.random()*3,Math.cos(a)*s,Math.sin(a)*s-1,0.02,50+Math.random()*30,"circle"));}}
      else if(tier===2){ for(let i=0;i<60;i++){particles.push(new Particle(Math.random()*canvas.width,-20-Math.random()*100,C2[Math.floor(Math.random()*C2.length)],3+Math.random()*4,(Math.random()-0.5)*4,2+Math.random()*3,0.05,80+Math.random()*40,Math.random()>0.5?"rect":"circle"));}}
      else if(tier===3){ [{x:cx,y:cy*0.6},{x:cx*0.5,y:cy*0.8},{x:cx*1.5,y:cy*0.7}].forEach((bp)=>{for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6; particles.push(new Particle(bp.x,bp.y,C3[Math.floor(Math.random()*C3.length)],2+Math.random()*4,Math.cos(a)*s,Math.sin(a)*s,0.06,60+Math.random()*40,Math.random()>0.3?"circle":"star"));}}); for(let i=0;i<40;i++){particles.push(new Particle(Math.random()*canvas.width,-20,C3[Math.floor(Math.random()*C3.length)],3+Math.random()*5,(Math.random()-0.5)*3,1+Math.random()*4,0.04,100+Math.random()*50,"rect"));}}
      else if(tier===4){ for(let b=0;b<5;b++){const bx=canvas.width*(0.2+Math.random()*0.6),by=canvas.height*(0.2+Math.random()*0.4); setTimeout(()=>{for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*8; particles.push(new Particle(bx,by,C4[Math.floor(Math.random()*C4.length)],3+Math.random()*5,Math.cos(a)*s,Math.sin(a)*s,0.05,70+Math.random()*50,["circle","star","rect"][Math.floor(Math.random()*3)]));}},b*300);} for(let i=0;i<80;i++){setTimeout(()=>{particles.push(new Particle(Math.random()*canvas.width,-20-Math.random()*60,C4[Math.floor(Math.random()*C4.length)],3+Math.random()*6,(Math.random()-0.5)*5,2+Math.random()*4,0.03,120+Math.random()*60,Math.random()>0.4?"rect":"star"));},Math.random()*1000);}}
      if(!animFrameId) animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles=particles.filter((p)=>p.life>0);
      particles.forEach((p)=>{p.update();p.draw(ctx);});
      if(particles.length>0) animFrameId=requestAnimationFrame(animateParticles);
      else { animFrameId=null; ctx.clearRect(0,0,canvas.width,canvas.height); }
    }

    /* =====================================================
       Redemption Ceremony
    ===================================================== */
    function getRedeemTier(cost) { if(cost<=5)return 1; if(cost<=15)return 2; if(cost<=30)return 3; return 4; }

    const TIER_CONFIG = {
      1:{emoji:"✨",title:"小确幸！",sub:"每一份小奖励都值得被记住",duration:2000},
      2:{emoji:"🎉",title:"太棒了！",sub:"努力有了回响，继续闪闪发光",duration:3000},
      3:{emoji:"🎆",title:"了不起的成就！",sub:"坚持的力量，让梦想照进现实",duration:4000},
      4:{emoji:"👑",title:"史诗级兑换！",sub:"这是属于你们的传奇时刻",duration:5500}
    };

    function showRedeemCeremony(product,cost) {
      const tier=getRedeemTier(cost), config=TIER_CONFIG[tier];
      const overlay=document.getElementById("redeemOverlay");
      document.getElementById("redeemEmoji").textContent=config.emoji;
      document.getElementById("redeemTitle").textContent=config.title;
      document.getElementById("redeemSub").textContent=`${product.owner} 兑换了「${product.name}」· ${config.sub}`;
      overlay.className=`redeem-overlay tier-${tier}`;
      requestAnimationFrame(()=>{overlay.classList.add("show");spawnParticles(tier);});
      const closeBtn=document.getElementById("redeemCloseBtn");
      let autoTimer=null;
      const closeCeremony=()=>{overlay.classList.remove("show");clearTimeout(autoTimer);closeBtn.removeEventListener("click",closeCeremony);};
      closeBtn.addEventListener("click",closeCeremony);
      autoTimer=setTimeout(closeCeremony,config.duration);
    }

    /* =====================================================
       Settings
    ===================================================== */
    function initSettings() {
      const savedBlur=localStorage.getItem("fc_blur");
      if(savedBlur!==null){document.documentElement.style.setProperty("--blur-val",savedBlur+"px");document.getElementById("blurSlider").value=savedBlur;document.getElementById("blurValue").textContent=savedBlur+"px";}
      document.getElementById("blurSlider").addEventListener("input",(e)=>{const v=e.target.value;document.documentElement.style.setProperty("--blur-val",v+"px");document.getElementById("blurValue").textContent=v+"px";localStorage.setItem("fc_blur",v);});
      const overlay=document.getElementById("settingsOverlay"),panel=document.getElementById("settingsPanel");
      const openSettings=()=>{overlay.classList.add("show");panel.classList.add("show");};
      const closeSettings=()=>{overlay.classList.remove("show");panel.classList.remove("show");};
      document.getElementById("settingsBtn").addEventListener("click",openSettings);
      overlay.addEventListener("click",closeSettings);
    }

    /* =====================================================
       Init
    ===================================================== */
    document.addEventListener("DOMContentLoaded", async () => {
      initSettings();
      initCardOptions();
      setupNav();
      setupPeriodTabs();
      setupForm();
      setupHistoryFilter();
      setupShopViewSwitch();
      setupAddProduct();

      // ★ 检查特殊日期
      checkSpecialDate();

      await Promise.all([loadLogs(), loadProducts()]);

      sb.channel("freecard-realtime").on("postgres_changes",{event:"*",schema:"public",table:"freecard_log"},()=>loadLogs()).subscribe();
      sb.channel("shop-realtime").on("postgres_changes",{event:"*",schema:"public",table:"freecard_shop"},()=>loadProducts()).subscribe();
    });

    /* =====================================================
       Navigation
    ===================================================== */
    function setupNav() {
      document.querySelectorAll(".nav-btn").forEach((btn)=>{
        btn.addEventListener("click",()=>{
          const page=btn.dataset.page;
          document.querySelectorAll(".app-page").forEach((s)=>s.classList.toggle("active",s.id===`page-${page}`));
          document.querySelectorAll(".nav-btn").forEach((b)=>{const active=b===btn;b.classList.toggle("active",active);b.setAttribute("aria-current",active?"page":"false");});
          window.scrollTo({top:0,behavior:"smooth"});
        });
      });
    }

    function setupPeriodTabs() {
      document.querySelectorAll(".period-tab").forEach((btn)=>{
        btn.addEventListener("click",()=>{
          document.querySelectorAll(".period-tab").forEach((b)=>b.classList.remove("active"));
          btn.classList.add("active");
          currentPeriod=btn.dataset.period;
          renderStats();
        });
      });
    }

    function setupForm() { document.getElementById("submitBtn").addEventListener("click",addLog); }
    function setupHistoryFilter() { document.getElementById("historyFilter").addEventListener("change",(e)=>{currentHistoryFilter=e.target.value;renderHistory();}); }
    function setupShopViewSwitch() {
      document.querySelectorAll(".shop-view-btn").forEach((btn)=>{
        btn.addEventListener("click",()=>{
          shopView=btn.dataset.view;
          document.querySelectorAll(".shop-view-btn").forEach((b)=>b.classList.remove("active"));
          btn.classList.add("active");
          renderShop();
        });
      });
    }

    function initCardOptions() {
      const sel=document.getElementById("cardNum");
      for(let i=1;i<=10;i++){const o=document.createElement("option");o.value=i;o.textContent=`${i} 张`;sel.appendChild(o);}
    }

    /* =====================================================
       Supabase Logs
    ===================================================== */
    async function loadLogs() {
      const {data,error}=await sb.from("freecard_log").select("*").order("created_at",{ascending:false});
      if(error){showToast("读取记录失败："+error.message,"error");return;}
      allLogs=data||[];
      refreshAll();
    }

    async function loadProducts() {
      const {data,error}=await sb.from("freecard_shop").select("*").order("created_at",{ascending:true});
      if(error){console.warn("freecard_shop table not found:",error.message);allProducts=[];renderShop();return;}
      allProducts=data||[];
      renderShop();
    }

    function refreshAll() { updateBalances(); updateHistoryFilterOptions(); renderStats(); renderHistory(); renderShop(); renderWeeklyCard(); }

    function calcBalance(op) {
      return allLogs.filter((l)=>l.operator===op).reduce((total,l)=>total+(l.change_type==="增加"?Number(l.card_num)||0:-(Number(l.card_num)||0)),0);
    }

    function updateBalances() {
      document.getElementById("torieBalance").textContent=calcBalance("Torie");
      document.getElementById("joryBalance").textContent=calcBalance("Jory");
    }

    function getStartOfToday() { const d=new Date(); d.setHours(0,0,0,0); return d; }
    function getStartOfWeek() { return getStartOfWeekDate(); }
    function getStartOfMonth() { const d=new Date(); d.setHours(0,0,0,0); d.setDate(1); return d; }

    function filterByPeriod(logs,period) {
      if(period==="all") return logs;
      const map={today:getStartOfToday,week:getStartOfWeek,month:getStartOfMonth};
      return logs.filter((l)=>new Date(l.created_at)>=map[period]());
    }

    function getStats(op) {
      const logs=filterByPeriod(allLogs,currentPeriod).filter((l)=>l.operator===op);
      let earned=0,spent=0;
      logs.forEach((l)=>{const n=Number(l.card_num)||0;if(l.change_type==="增加")earned+=n;else spent+=n;});
      return {earned,spent};
    }

    function renderStats() {
      const t=getStats("Torie"),j=getStats("Jory");
      const totalEarned=t.earned+j.earned,totalSpent=t.spent+j.spent,net=totalEarned-totalSpent;
      const pLabel={today:"今日",week:"本周",month:"本月",all:"累计"}[currentPeriod]||"";
      document.getElementById("statsSummary").innerHTML=`
        <div class="summary-item"><div class="summary-label">${pLabel}获得</div><div class="summary-value plus">+${totalEarned}</div></div>
        <div class="summary-item"><div class="summary-label">${pLabel}使用</div><div class="summary-value minus">−${totalSpent}</div></div>
        <div class="summary-item"><div class="summary-label">${pLabel}净积累</div><div class="summary-value ${net>=0?"net":"minus"}">${net>=0?"+":""}${net}</div></div>
      `;
      const max=Math.max(t.earned,t.spent,j.earned,j.spent);
      const group=(label,key)=>{
        if(max===0) return `<div class="stats-group"><div class="stats-label">${label}</div><div class="empty-stats">暂无${label}记录</div></div>`;
        return `<div class="stats-group"><div class="stats-label">${label}</div>${bar("Torie",t[key],max,"torie-bar")}${bar("Jory",j[key],max,"jory-bar")}</div>`;
      };
      document.getElementById("statsContent").innerHTML=group("获得","earned")+group("消耗","spent");
    }

    function bar(name,val,max,cls) {
      const w=max===0?0:(val/max)*100;
      return `<div class="bar-row"><div class="bar-name">${name}</div><div class="bar-track"><div class="bar ${cls}" style="width:${w}%"></div></div><div class="bar-number">${val}</div></div>`;
    }

    function updateHistoryFilterOptions() {
      const select=document.getElementById("historyFilter");
      const months=new Set();
      allLogs.forEach((l)=>{const d=new Date(l.created_at);months.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);});
      const sorted=[...months].sort((a,b)=>b.localeCompare(a));
      const current=currentHistoryFilter;
      select.innerHTML='<option value="all">全部</option>';
      sorted.forEach((key)=>{const[y,m]=key.split("-");const o=document.createElement("option");o.value=key;o.textContent=`${y}年${Number(m)}月`;select.appendChild(o);});
      if([...select.options].some((o)=>o.value===current))select.value=current;
      else{currentHistoryFilter="all";select.value="all";}
    }

    function getHistoryLogs() {
      if(currentHistoryFilter==="all") return allLogs;
      return allLogs.filter((l)=>{const d=new Date(l.created_at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`===currentHistoryFilter;});
    }

    function renderHistory() {
      const container=document.getElementById("historyList");
      const logs=getHistoryLogs();
      if(!logs.length){container.innerHTML='<div class="empty-history">暂无记录 🍃</div>';return;}
      container.innerHTML=logs.map((l)=>{
        const d=new Date(l.created_at),time=fmtDate(d);
        const plus=l.change_type==="增加",symbol=plus?"+":"−";
        const person=esc(l.operator),reason=esc(l.reason||"—"),id=escAttr(l.id);
        return `<div class="history-item"><div><div class="history-top"><span class="history-person">${person}</span><span class="history-reason" title="${reason}">${reason}</span></div><div class="history-time">${time}</div></div><div class="history-right"><div class="history-change ${plus?"plus":"minus"}">${symbol}${Number(l.card_num)}</div><button class="delete-btn" type="button" data-delete-id="${id}">删除</button></div></div>`;
      }).join("");
      container.querySelectorAll("[data-delete-id]").forEach((button)=>{button.addEventListener("click",()=>{deleteLog(button.dataset.deleteId);});});
    }

    function setupAddProduct() { document.getElementById("addProductBtn").addEventListener("click",addProduct); }

    async function addProduct() {
      const nameEl=document.getElementById("newProductName"),costEl=document.getElementById("newProductCost");
      const name=nameEl.value.trim(),cost=parseInt(costEl.value);
      if(!name){showToast("请输入商品名称","error");return;}
      if(!cost||cost<1){showToast("价格至少为 1 张","error");return;}
      const btn=document.getElementById("addProductBtn");btn.disabled=true;btn.textContent="…";
      const {error}=await sb.from("freecard_shop").insert({name,cost,owner:shopView});
      btn.disabled=false;btn.textContent="添加";
      if(error){showToast("添加失败："+error.message,"error");return;}
      nameEl.value="";costEl.value="";showToast("商品已上架 🎉","success");await loadProducts();
    }

    async function deleteProduct(id) {
      if(!confirm("确定下架此商品？"))return;
      const {error}=await sb.from("freecard_shop").delete().eq("id",id);
      if(error){showToast("删除失败："+error.message,"error");return;}
      showToast("已下架","success");await loadProducts();
    }

    async function editProduct(id,oldName,oldCost) {
      const newName=prompt("修改商品名称：",oldName);if(newName===null)return;
      const newCost=prompt("修改价格（张）：",oldCost);if(newCost===null)return;
      const cost=parseInt(newCost);
      if(!newName.trim()||!cost||cost<1){showToast("输入无效","error");return;}
      const {error}=await sb.from("freecard_shop").update({name:newName.trim(),cost}).eq("id",id);
      if(error){showToast("修改失败："+error.message,"error");return;}
      showToast("已更新","success");await loadProducts();
    }

    async function redeemProduct(product) {
      const balance=calcBalance(product.owner);
      if(balance<product.cost){showToast(`${product.owner} 余额不足`,"error");return;}
      if(!confirm(`确认花费 ${product.cost} 张自由卡兑换「${product.name}」？`))return;
      const {error}=await sb.from("freecard_log").insert({operator:product.owner,change_type:"减少",card_num:product.cost,reason:`🛒 兑换：${product.name}`});
      if(error){showToast("兑换失败："+error.message,"error");return;}
      showRedeemCeremony(product,product.cost);await loadLogs();
    }

    function renderShop() {
      const container=document.getElementById("shopList");
      const products=allProducts.filter((p)=>p.owner===shopView);
      const balance=calcBalance(shopView);
      if(!products.length){container.innerHTML='<div class="empty-shop">还没有商品，快来添加吧 🛍️</div>';return;}
      container.innerHTML=products.map((p)=>{
        const pct=Math.min(100,Math.round((balance/p.cost)*100));
        const canRedeem=balance>=p.cost,diff=p.cost-balance;
        let itemClass="shop-item",barExtraClass="",progressText="";
        if(canRedeem){itemClass+=" ready-to-redeem";barExtraClass=" full shimmer";progressText=`<span>✅ 已达成！可以兑换啦</span><span>${balance} / ${p.cost} 张</span>`;}
        else if(pct>=80){itemClass+=" almost-there";barExtraClass=" shimmer";progressText=`<span>🔥 就差一点了！</span><span>${balance} / ${p.cost} 张</span>`;}
        else if(pct>=50){itemClass+=" halfway-there";barExtraClass=" shimmer-slow";progressText=`<span>💪 已经过半啦，继续加油</span><span>${balance} / ${p.cost} 张</span>`;}
        else{progressText=`<span>${balance} / ${p.cost} 张</span><span>还差 ${diff} 张</span>`;}
        const barClass=`shop-bar ${shopView.toLowerCase()}${barExtraClass}`;
        return `<div class="${itemClass}"><div class="shop-item-header"><div class="shop-item-name">${esc(p.name)}</div><div class="shop-item-cost">${p.cost} 张自由卡</div></div><div class="shop-progress-text">${progressText}</div><div class="shop-bar-track"><div class="${barClass}" style="width:${pct}%"></div></div><div class="shop-actions"><button class="shop-action-btn btn-redeem" ${canRedeem?"":"disabled"} data-redeem-id="${escAttr(p.id)}">${canRedeem?"🎁 立即兑换":"余额不足"}</button><button class="shop-action-btn btn-edit" data-edit-id="${escAttr(p.id)}">编辑</button><button class="shop-action-btn btn-del" data-product-id="${escAttr(p.id)}">下架</button></div></div>`;
      }).join("");
      container.querySelectorAll("[data-redeem-id]").forEach((b)=>{b.addEventListener("click",()=>{const p=allProducts.find((x)=>String(x.id)===String(b.dataset.redeemId));if(p)redeemProduct(p);});});
      container.querySelectorAll("[data-edit-id]").forEach((b)=>{b.addEventListener("click",()=>{const p=allProducts.find((x)=>String(x.id)===String(b.dataset.editId));if(p)editProduct(p.id,p.name,p.cost);});});
      container.querySelectorAll("[data-product-id]").forEach((b)=>{b.addEventListener("click",()=>{deleteProduct(b.dataset.productId);});});
    }

    async function addLog() {
      const op=document.getElementById("operator").value,ct=document.getElementById("changeType").value;
      const reason=document.getElementById("reason").value.trim();
      const num=Number(document.getElementById("cardNum").value);
      if(!reason){showToast("请填写原因","error");return;}
      if(!Number.isInteger(num)||num<1||num>10){showToast("数量必须是 1–10 张","error");return;}
      if(ct==="减少"&&calcBalance(op)<num){showToast(`${op} 当前只有 ${calcBalance(op)} 张，不够减`,"error");return;}
      const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="保存中…";
      const {error}=await sb.from("freecard_log").insert({operator:op,change_type:ct,card_num:num,reason});
      btn.disabled=false;btn.textContent="提交记录";
      if(error){showToast("保存失败："+error.message,"error");return;}
      document.getElementById("reason").value="";showToast("记录成功 🎉","success");await loadLogs();
    }

    async function deleteLog(id) {
      if(!confirm("确定删除这条记录？"))return;
      const {error}=await sb.from("freecard_log").delete().eq("id",id);
      if(error){showToast("删除失败："+error.message,"error");return;}
      showToast("已删除","success");await loadLogs();
    }

    function fmtDate(d) { const p=(n)=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
    function esc(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function escAttr(v) { return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#039;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    function showToast(msg,type="success") {
      const toast=document.getElementById("toast");toast.textContent=msg;toast.className=`toast ${type} show`;
      clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{toast.classList.remove("show");},2500);
    }
  </script>
</body>
</html>
