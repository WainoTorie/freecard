<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自由卡双人记录</title>
    <style>
        body {
            background: #f4f7fa;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 2px 12px #00000010;
        }
        h1 {
            text-align: center;
            color: #2563eb;
        }
        .score-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:20px;
            margin-bottom:30px;
        }
        .card-box{
            background:#eff6ff;
            text-align:center;
            padding:20px;
            border-radius:12px;
        }
        .name{
            font-size:22px;
            font-weight:bold;
            color:#2563eb;
        }
        .num{
            font-size:40px;
            font-weight:bold;
            margin:8px 0;
        }
        .form-row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            margin-bottom:16px;
        }
        label{
            display:block;
            margin-bottom:6px;
            font-weight:500;
        }
        select,textarea{
            width:100%;
            padding:10px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            font-size:16px;
        }
        textarea{
            min-height:80px;
        }
        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>自由卡双人记录</h1>
        <div class="score-row">
            <div class="card-box">
                <div class="name">Torie</div>
                <div class="num" id="torieCount">0</div>
                <div>张</div>
            </div>
            <div class="card-box">
                <div class="name">Jory</div>
                <div class="num" id="joryCount">0</div>
                <div>张</div>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>操作人</label>
                <select id="operator">
                    <option>Torie</option>
                    <option>Jory</option>
                </select>
            </div>
            <div>
                <label>变动类型</label>
                <select id="changeType">
                    <option value="add">增加✅</option>
                    <option value="sub">减少❌</option>
                </select>
            </div>
        </div>
        <div style="margin-bottom:16px;">
            <label>卡片数量 (1~10)</label>
            <select id="cardNum">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
            </select>
        </div>
        <div style="margin-bottom:20px;">
            <label>事件原因</label>
            <textarea id="reason"></textarea>
        </div>
        <button type="button" onclick="submitRecord()">提交记录</button>
    </div>

<script>
// 读取本地存储
function loadData(){
    let data = JSON.parse(localStorage.getItem("freecardData")) || {
        torie:0,
        jory:0,
        logs:[]
    };
    document.getElementById("torieCount").innerText = data.torie;
    document.getElementById("joryCount").innerText = data.jory;
}

// 提交记录核心函数
function submitRecord(){
    const op = document.getElementById("operator").value;
    const type = document.getElementById("changeType").value;
    const num = parseInt(document.getElementById("cardNum").value);
    const reason = document.getElementById("reason").value.trim();
    if(!reason){
        alert("请填写事件原因");
        return;
    }
    let data = JSON.parse(localStorage.getItem("freecardData")) || {torie:0,jory:0,logs:[]};
    if(op === "Torie"){
        if(type === "add") data.torie += num;
        else data.torie -= num;
    }else{
        if(type === "add") data.jory += num;
        else data.jory -= num;
    }
    // 新增日志
    data.logs.push({
        operator:op,
        type:type,
        num:num,
        reason:reason,
        time:new Date().toLocaleString()
    })
    localStorage.setItem("freecardData",JSON.stringify(data));
    loadData();
    alert("提交成功！");
    document.getElementById("reason").value = "";
}

// 页面加载自动读取数据
loadData();
</script>
</body>
</html>
